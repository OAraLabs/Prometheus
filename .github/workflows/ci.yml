name: CI

# The June 2026 audit's cheapest durable win: the suite is ~3,000 tests in well
# under a minute, so gating every push/PR on it is nearly free and would have
# caught the regressions this repo has historically shipped (tested-but-unwired,
# string-vs-ContentBlock). Network-marked tests are excluded (no live model in CI).
#
# Provenance: authored in the 2026-06 repo audit (untracked at the repo root
# because the gh token lacked `workflow` scope), folded into the branch and
# modernized for Onboarding Phase 3: uv-based install/test invocation matching
# the project's canonical dev loop (`uv sync --extra web --extra anthropic
# --extra mcp --group dev` + `PYTHONPATH=$PWD/src uv run pytest`).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Never let uv download its own interpreter: that download is a GitHub
      # release asset, which would reintroduce the dependency this file exists to
      # avoid, and it would silently test a Python the matrix never asked for.
      #
      # The interpreter itself is selected with an explicit `--python` FLAG on the
      # sync below, not via UV_PYTHON. Measured 2026-08-17 on uv 0.11.15: the flag
      # form is honoured everywhere, but `UV_PYTHON=3.12 uv python find` returned
      # a 3.11 interpreter and exited 0. UV_PYTHON is honoured by `uv venv`, so it
      # is not broken — just not uniform across subcommands, which is not a thing
      # to rest a version matrix on. The assertion step below makes any such
      # mismatch loud instead of silent.
      UV_PYTHON_DOWNLOADS: never
    steps:
      # Third-party actions are pinned to a full commit SHA (supply-chain
      # hygiene: a moved tag cannot silently change what executes here). Note
      # this is NOT what fixes the 429 described below — see that note.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── WHY uv IS INSTALLED FROM PyPI AND NOT VIA astral-sh/setup-uv ─────────
      #
      # 2026-08-17: `astral-sh/setup-uv@v5` failed CI repeatedly with HTTP 429 on
      # https://codeload.github.com/astral-sh/setup-uv/tar.gz/<sha> — the runner
      # downloading THE ACTION'S OWN TARBALL during "Set up job", before any step
      # in this file executes. Seen on runs 32042309899 and 32043255382, both on
      # the 3.12 leg, each burning 50-100s of retries before failing.
      #
      # IF THIS RECURS, READ THE LAST LINE CAREFULLY. The runner retries three
      # times with backoff and the FINAL error is `503 (Service Unavailable)`,
      # not the 429. The terminal message never names rate limiting, which is why
      # every occurrence needed a log read to tell infrastructure from a real
      # test failure.
      #
      # Two fixes that look right and are not:
      #   - Pinning setup-uv to a SHA changes nothing. The runner ALREADY resolves
      #     @v5 to a SHA and the failing URL contains it, so a pinned reference
      #     emits a byte-identical request.
      #   - Caching the action is not possible. Action tarballs are fetched during
      #     "Set up job", before any step runs, so actions/cache is structurally
      #     too late to help.
      # Installing uv from PyPI is the only option that removes the download.
      #
      # So: if you are tempted to tidy this back to `uses: astral-sh/setup-uv`,
      # that is the exact change this comment exists to prevent. It reinstates a
      # third-party codeload fetch on every job in the matrix.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv (from PyPI — deliberately not astral-sh/setup-uv)
        run: python -m pip install --upgrade uv
      - name: Sync dependencies (web + anthropic + mcp extras, dev group)
        # mcp added 2026-08-28 (handoff item 3): the MCP subsystem had NEVER
        # run in CI — every MCP test file importorskips on the SDK, and this
        # sync excluded it, so ~50 tests across the client, the allowlist,
        # and the bootstrap silently skipped on every run while the daemon
        # gained MCP as its sanctioned third-party tool path (#315). A
        # subsystem's tests skipping is not the same as passing.
        run: uv sync --python ${{ matrix.python-version }} --extra web --extra anthropic --extra mcp --group dev
      - name: Assert the environment is the interpreter this matrix leg asked for
        # setup-uv took `python-version` directly, so the leg was self-evidently
        # right. Now that selection is uv's, a wrong-but-working interpreter would
        # mean two legs silently testing the same Python and a green matrix that
        # covers half of what it claims. Cheap to check, invisible when it breaks.
        run: >
          uv run python -c "import sys; got='%d.%d' % sys.version_info[:2];
          want='${{ matrix.python-version }}';
          print('interpreter:', got);
          sys.exit(0 if got == want else f'MATRIX MISMATCH: wanted {want}, got {got}')"
      - name: Run test suite (excluding network-dependent tests)
        # The once-"known failure" (test_empty_memory_files_no_section) was
        # never a broken test — it read the developer's REAL ~/.prometheus
        # state. conftest's _isolated_state_dirs fixture now sandboxes every
        # test, so the full suite gates with no deselects.
        run: >
          PYTHONPATH=$PWD/src uv run pytest -m "not network" -q
