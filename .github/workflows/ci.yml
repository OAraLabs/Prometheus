name: CI

# The June 2026 audit's cheapest durable win: the suite is ~3,000 tests in well
# under a minute, so gating every push/PR on it is nearly free and would have
# caught the regressions this repo has historically shipped (tested-but-unwired,
# string-vs-ContentBlock). Network-marked tests are excluded (no live model in CI).
#
# Provenance: authored in the 2026-06 repo audit (untracked at the repo root
# because the gh token lacked `workflow` scope), folded into the branch and
# modernized for Onboarding Phase 3: uv-based install/test invocation matching
# the project's canonical dev loop (`uv sync --extra web --extra anthropic
# --extra mcp --group dev` + `PYTHONPATH=$PWD/src uv run pytest`).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Never let uv download its own interpreter: that download is a GitHub
      # release asset, which would reintroduce the dependency this file exists to
      # avoid, and it would silently test a Python the matrix never asked for.
      #
      # The interpreter itself is selected with an explicit `--python` FLAG on the
      # sync below, not via UV_PYTHON. Measured 2026-08-17 on uv 0.11.15: the flag
      # form is honoured everywhere, but `UV_PYTHON=3.12 uv python find` returned
      # a 3.11 interpreter and exited 0. UV_PYTHON is honoured by `uv venv`, so it
      # is not broken — just not uniform across subcommands, which is not a thing
      # to rest a version matrix on. The assertion step below makes any such
      # mismatch loud instead of silent.
      UV_PYTHON_DOWNLOADS: never
    steps:
      # Third-party actions are pinned to a full commit SHA (supply-chain
      # hygiene: a moved tag cannot silently change what executes here). Note
      # this is NOT what fixes the 429 described below — see that note.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── WHY uv IS INSTALLED FROM PyPI AND NOT VIA astral-sh/setup-uv ─────────
      #
      # 2026-08-17: `astral-sh/setup-uv@v5` failed CI repeatedly with HTTP 429 on
      # https://codeload.github.com/astral-sh/setup-uv/tar.gz/<sha> — the runner
      # downloading THE ACTION'S OWN TARBALL during "Set up job", before any step
      # in this file executes. Seen on runs 32042309899 and 32043255382, both on
      # the 3.12 leg, each burning 50-100s of retries before failing.
      #
      # IF THIS RECURS, READ THE LAST LINE CAREFULLY. The runner retries three
      # times with backoff and the FINAL error is `503 (Service Unavailable)`,
      # not the 429. The terminal message never names rate limiting, which is why
      # every occurrence needed a log read to tell infrastructure from a real
      # test failure.
      #
      # Two fixes that look right and are not:
      #   - Pinning setup-uv to a SHA changes nothing. The runner ALREADY resolves
      #     @v5 to a SHA and the failing URL contains it, so a pinned reference
      #     emits a byte-identical request.
      #   - Caching the action is not possible. Action tarballs are fetched during
      #     "Set up job", before any step runs, so actions/cache is structurally
      #     too late to help.
      # Installing uv from PyPI is the only option that removes the download.
      #
      # So: if you are tempted to tidy this back to `uses: astral-sh/setup-uv`,
      # that is the exact change this comment exists to prevent. It reinstates a
      # third-party codeload fetch on every job in the matrix.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv (from PyPI — deliberately not astral-sh/setup-uv)
        run: python -m pip install --upgrade uv
      - name: Sync dependencies (web + anthropic + mcp extras, dev group)
        # mcp added 2026-08-28 (handoff item 3): the MCP subsystem had NEVER
        # run in CI — every MCP test file importorskips on the SDK, and this
        # sync excluded it, so ~50 tests across the client, the allowlist,
        # and the bootstrap silently skipped on every run while the daemon
        # gained MCP as its sanctioned third-party tool path (#315). A
        # subsystem's tests skipping is not the same as passing.
        run: uv sync --python ${{ matrix.python-version }} --extra web --extra anthropic --extra mcp --group dev
      - name: Assert the environment is the interpreter this matrix leg asked for
        # setup-uv took `python-version` directly, so the leg was self-evidently
        # right. Now that selection is uv's, a wrong-but-working interpreter would
        # mean two legs silently testing the same Python and a green matrix that
        # covers half of what it claims. Cheap to check, invisible when it breaks.
        run: >
          uv run python -c "import sys; got='%d.%d' % sys.version_info[:2];
          want='${{ matrix.python-version }}';
          print('interpreter:', got);
          sys.exit(0 if got == want else f'MATRIX MISMATCH: wanted {want}, got {got}')"
      - name: Run test suite (excluding network-dependent tests)
        # The once-"known failure" (test_empty_memory_files_no_section) was
        # never a broken test — it read the developer's REAL ~/.prometheus
        # state. conftest's _isolated_state_dirs fixture now sandboxes every
        # test, so the full suite gates with no deselects.
        #
        # COVERAGE FLOOR (2026-09-09). Measured 76% on this SHA; the floor sits
        # one point below so a runner-to-runner difference cannot turn a green
        # suite red, while a real drop still does. It only goes UP — raise it
        # when the number does, and never lower it to make a PR pass.
        run: >
          PYTHONPATH=$PWD/src uv run pytest -m "not network" -q
          --cov --cov-report=term:skip-covered --cov-fail-under=75

  # Lint, types and dependency advisories. A separate job so it reports its own
  # red X: folded into `test` these would be invisible behind a suite failure,
  # and they answer different questions.
  #
  # WHY THESE FOUR AND NOT A STYLE SUITE. Each was chosen because it has already
  # caught something in this repository, not because it is conventional:
  #   * ruff found a live NameError (F821), a task that was never registered
  #     for shutdown cancellation (F841) and two same-named route handlers
  #     3000 lines apart (F811).
  #   * the type gate is a RATCHET, not a cliff — 447 errors across 122 modules
  #     would fail on day one and get switched off. See scripts/mypy_gate.py.
  #   * pip-audit had 6 advisories across 3 packages when this landed; all had
  #     fix versions, so the lock moved and the gate blocks from zero.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv (from PyPI — matching the test job)
        run: python -m pip install --upgrade uv
      - name: Sync dependencies (same extras as the test job, plus the lint group)
        # The SAME extras the suite uses. A narrower env would type-check a
        # different import graph than the one that ships.
        run: uv sync --extra web --extra anthropic --extra mcp --group dev --group lint

      - name: Lint (ruff, src/)
        # Config lives in pyproject [tool.ruff]; scope and next-widening plan
        # are documented there rather than duplicated here.
        run: uv run ruff check src/

      - name: Types (mypy, ratcheted against mypy-debt.txt)
        # Fails on an error in an already-clean module AND on a debt entry that
        # has become clean, so the list can only shrink.
        run: uv run python scripts/mypy_gate.py

      - name: Dependency advisories (pip-audit)
        # Audits the RESOLVED lock, not the loose ranges in pyproject: the lock
        # is what installs, and a range that permits a fixed version proves
        # nothing about what CI and the deploy clone actually get.
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/requirements-audit.txt
          uv run pip-audit -r /tmp/requirements-audit.txt --progress-spinner off

  # The security floors, actually executed. Until now they SKIPPED on every CI
  # run and had been proven only on the operator's own machine — and the files
  # themselves say "SKIPPED IS NOT PASSED: these are live holes, not covered
  # ground." A floor nothing exercises is a claim, not a floor.
  #
  # MEASURED on ubuntu-24.04 (runner image 20260831) before this job was
  # written, because none of it is guessable from a dev box:
  #   bwrap                                     NOT INSTALLED
  #   kernel.apparmor_restrict_unprivileged_userns  = 1  -> bwrap exits 1
  #   after `sysctl -w ...=0`                          -> bwrap exits 0
  #   apparmor_parser -r deploy/apparmor/prometheus-bash -> exit 0, enforce
  #   write_preflight        -> (True, 'bwrap mount namespace: ...')
  #   profile preflight      -> (True, 'prometheus-bash (enforce)')
  #
  # WHY RELAXING THE SYSCTL IS ACCEPTABLE HERE AND NOWHERE ELSE. Ubuntu 24.04
  # restricts unprivileged user namespaces, which is what blocks bwrap. This
  # job turns that off on a DISPOSABLE VM that exists for one run and holds no
  # secrets beyond the checkout. Do NOT copy this line to a host: on the
  # operator's machine the sanctioned route is the AppArmor profile in
  # /etc/apparmor.d/bwrap, not a global sysctl.
  security-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync dependencies
        run: uv sync --extra web --extra anthropic --extra mcp --group dev

      - name: Install bubblewrap and permit unprivileged namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / -- /bin/true

      - name: Load the shipped AppArmor profile
        # The same file the deploy installs, so CI proves THAT profile rather
        # than a CI-only approximation of it.
        run: |
          sudo apparmor_parser -r -W deploy/apparmor/prometheus-bash
          sudo aa-status | grep -q prometheus-bash

      - name: Provide the two preconditions these tests legitimately need
        # Deliberately NOT solved by adding skips. The decoy fixture writes
        # under ~/.ssh, and the git-network case reaches the network from the
        # deploy clone's path — both are real properties of the operator's box,
        # so CI reproduces them instead of excusing the tests from running.
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}" "$HOME/prometheus-deploy"

      - name: Refuse to continue if the floors are not actually active
        # THE POINT OF THE JOB. Without this, a future runner image that blocks
        # bwrap again would make every floor test skip and the job would go
        # green having proven nothing — the exact state this replaces.
        run: |
          PYTHONPATH=$PWD/src uv run python -c "
          import sys
          from prometheus.permissions import confinement as C
          w_ok, w = C.write_preflight(force=True)
          p_ok, p = C.preflight(C.PROFILE, force=True)
          print('write floor :', w_ok, w)
          print('apparmor    :', p_ok, p)
          if not (w_ok and p_ok):
              sys.exit('FLOORS INACTIVE — the tests below would skip, and a skip is not a pass.')
          "

      # tests/test_bwrap_sandbox.py is DELIBERATELY NOT HERE, and the reason is
      # a finding rather than an exclusion of convenience. Its 9 cases skip
      # with "bwrap cannot run a namespaced process in EITHER network policy on
      # this host: bwrap: execvp /bin/sh: No such file or directory" — measured
      # BOTH on this runner (where write_preflight succeeds, so bwrap itself
      # works) and on the operator's own machine. That is a defect in the
      # CODING sandbox's bind set, not a gap in CI, and it means the bwrap
      # coding backend cannot start a shell anywhere it has been measured.
      # Adding the file here would only convert a silent skip into a red job
      # without fixing anything; it wants its own change, with the diagnosis
      # done somewhere bwrap is not already nested.
      - name: Run the security floors (and assert nothing skipped)
        run: |
          set -o pipefail
          PYTHONPATH=$PWD/src uv run pytest \
            tests/test_bash_write_floor.py \
            tests/test_bash_confinement.py \
            tests/test_bash_floor_reporting.py \
            tests/test_bwrap_sandbox.py \
            -q -rs --no-header | tee /tmp/floors.txt
          if grep -qE "[0-9]+ skipped" /tmp/floors.txt; then
            echo "::error::A security-floor test SKIPPED. That is the condition this job exists to end."
            exit 1
          fi

  # The stranger's first ten minutes, executed — not unit-tested. Each leg
  # clones this SHA into a temp tree, builds a venv, runs the README's
  # install line, then setup / doctor / one CLI tool turn / daemon + one
  # REST turn, with a non-inherited environment so nothing only the
  # developer has can leak in. `local` detects a stub model server;
  # `cloud` (2026-09-01) is the GPU-less box: no local server, one cloud
  # key exported, and the provider aimed at the stub so no real endpoint
  # is ever reached. Until this job existed the harness had never run
  # anywhere but the developer's machine.
  firstlight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        leg: [local, cloud]
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # S1 clones the source at its current SHA; a shallow checkout
          # has one, which is all it needs.
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: FIRSTLIGHT ${{ matrix.leg }} leg
        # The harness is stdlib-only and builds its own venv; nothing is
        # installed here on purpose — an install step above it would be a
        # thing the stranger does not have.
        run: python scripts/firstlight_harness.py --source . --leg ${{ matrix.leg }}
