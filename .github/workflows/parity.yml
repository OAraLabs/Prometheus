name: Parity

# WP-1.2 — the golden-trace parity harness, run beside the full suite (ci.yml)
# on every PR that touches the daemon seams: engine/, hooks/, router/,
# adapter/. It boots a REAL daemon from this checkout, replays the recorded
# turns in tests/fixtures/parity/ through it against a model server that
# answers from the recording, and fails on any difference in tool calls, gate
# decisions, checkpoints, memory writes, telemetry rows, final replies — or in
# a single request the daemon sends to the model. See scripts/parity/.
#
# The harness's own files trigger it too: a change to the instrument has to
# run the instrument.
#
# Deliberately a separate workflow rather than a job in ci.yml: a paths filter
# only exists at the workflow level, and this job is ~1 minute of daemon boots
# that PRs outside these directories do not need.

on:
  pull_request:
    paths:
      - "src/prometheus/engine/**"
      - "src/prometheus/hooks/**"
      - "src/prometheus/router/**"
      - "src/prometheus/adapter/**"
      - "scripts/parity/**"
      - "scripts/parity_harness.py"
      - "tests/fixtures/parity/**"
      - "tests/test_parity_harness.py"
      - ".github/workflows/parity.yml"
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same stance as ci.yml: never let uv download an interpreter.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv (from PyPI — see ci.yml for why not astral-sh/setup-uv)
        run: python -m pip install --upgrade uv
      - name: Sync dependencies (the same extras the suite uses)
        run: uv sync --python 3.12 --extra web --extra anthropic --extra mcp --group dev
      - name: Replay every parity trace against this checkout's daemon
        # Exit 0 = parity; 1 = a diff (the report above names the category and
        # the rows); 2 = the harness itself could not run — never a pass.
        run: uv run python scripts/parity_harness.py replay
      - name: Keep the daemon logs when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-daemon-logs
          path: /tmp/prometheus-parity.daemon.log
          if-no-files-found: ignore
