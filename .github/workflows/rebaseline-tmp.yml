# TEMPORARY (2026-11-14): runs the parity harness's rebaseline-from-exchanges on the CI replay host for the chat
# projects store (#932), which adds three empty tables to lcm.db. Uploads the diff; never merged.
name: rebaseline-tmp
on:
  push:
    branches: [ci/rebaseline-chat-projects]
permissions:
  contents: read
jobs:
  rebaseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade uv
      - run: uv sync --python 3.12 --extra web --extra mcp --group dev
      - name: Dry run (prints the per-column diff)
        run: uv run python scripts/parity_harness.py rebaseline-from-exchanges --dry-run
      - name: Rebaseline
        run: uv run python scripts/parity_harness.py rebaseline-from-exchanges
      - run: git diff -- tests/fixtures/parity > rebaseline.patch; git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebaseline-patch
          path: rebaseline.patch
