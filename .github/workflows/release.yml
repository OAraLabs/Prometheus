name: Release

# Onboarding Phase 3 (distribution): tag `vX.Y.Z` (or run manually) → build the
# sdist + wheel and attach them to a DRAFT GitHub Release. Nothing is published
# automatically: the release stays a draft until a human publishes it, and the
# PyPI step is skipped entirely unless the PYPI_API_TOKEN secret exists
# (Settings → Secrets and variables → Actions). Add that secret only when the
# `oara-prometheus` name is ready to go live on PyPI.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # Job-level so the step-level `if:` can see it (secrets context is not
      # available in job-level conditionals).
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      # See ci.yml: never let uv download an interpreter (that download is a
      # GitHub release asset). The venv below names its Python with an explicit
      # flag rather than relying on UV_PYTHON.
      UV_PYTHON_DOWNLOADS: never
    steps:
      # Actions pinned to full commit SHAs — supply-chain hygiene, NOT the fix
      # for the codeload 429 documented in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # uv comes from PyPI, not astral-sh/setup-uv. The full reasoning lives in
      # .github/workflows/ci.yml — in short, the runner's fetch of the action's
      # own tarball from codeload.github.com started returning 429 on 2026-08-17,
      # surfacing as a terminal 503. This job is a single leg so it is hit less
      # often than the CI matrix, but a spurious failure on the RELEASE path is
      # worse than one on a PR, so it gets the same treatment.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv (from PyPI — deliberately not astral-sh/setup-uv)
        run: python -m pip install --upgrade uv
      - name: Build sdist + wheel
        run: uv build
      - name: Smoke the wheel (install into a scratch venv, `prometheus --help`)
        run: |
          uv venv --python 3.12 /tmp/relcheck
          uv pip install --python /tmp/relcheck/bin/python dist/*.whl
          /tmp/relcheck/bin/prometheus --help
      - name: Upload build artifacts (always, incl. workflow_dispatch runs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
      - name: Attach to a draft GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Prometheus $GITHUB_REF_NAME" \
            --notes "Draft release for $GITHUB_REF_NAME — publish manually after review." \
            || true  # already exists (e.g. re-run) → just upload
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Publish to PyPI (ONLY when the PYPI_API_TOKEN secret is set)
        if: startsWith(github.ref, 'refs/tags/v') && env.PYPI_API_TOKEN != ''
        run: uv publish --token "$PYPI_API_TOKEN"
