  - id: fe-proration-billing
    difficulty: hard
    notes: >
      hard — three bugs in one function (fixed 30-day month, exclusive day
      count, floor instead of round-half-up); tests include a leap February
      and an exact half cent. Visible tests.
    prompt: >
      prorated_cents in {workspace}/billing.py charges most customers the wrong
      amount. Fix billing.py so it does what its docstring says and the tests
      in test_billing.py pass. Keep the arithmetic in integer cents. You can
      run the tests with `python3 -m unittest -q test_billing`.
    setup_files:
      billing.py: |
        from datetime import date


        def days_in_month(year, month):
            return 30


        def prorated_cents(monthly_cents, start, end):
            """Charge for the days start..end (BOTH inclusive) of one calendar month.

            The charge is monthly_cents * days_used / days_in_that_month,
            rounded to the nearest cent, with exact halves rounded up.
            start and end must be dates in the same month.
            """
            if (start.year, start.month) != (end.year, end.month):
                raise ValueError("start and end must be in the same month")
            days_used = (end - start).days
            total = days_in_month(start.year, start.month)
            return (monthly_cents * days_used) // total
      test_billing.py: &fe_billing_tests |
        import unittest
        from datetime import date

        from billing import prorated_cents


        class Proration(unittest.TestCase):
            def test_full_leap_february(self):
                self.assertEqual(prorated_cents(2900, date(2028, 2, 1), date(2028, 2, 29)), 2900)

            def test_full_31_day_month(self):
                self.assertEqual(prorated_cents(3100, date(2027, 1, 1), date(2027, 1, 31)), 3100)

            def test_one_day_of_april(self):
                self.assertEqual(prorated_cents(1000, date(2027, 4, 10), date(2027, 4, 10)), 33)

            def test_ten_days_of_february(self):
                # 1999 * 10 / 28 = 713.93
                self.assertEqual(prorated_cents(1999, date(2027, 2, 11), date(2027, 2, 20)), 714)

            def test_exact_half_rounds_up(self):
                # 75 * 1 / 30 = 2.5
                self.assertEqual(prorated_cents(75, date(2027, 6, 5), date(2027, 6, 5)), 3)

            def test_different_months_rejected(self):
                with self.assertRaises(ValueError):
                    prorated_cents(1000, date(2027, 1, 30), date(2027, 2, 2))


        if __name__ == "__main__":
            unittest.main()
