  - id: fe-elapsed-minutes-offsets
    difficulty: medium
    notes: >
      medium — timezone bug: offsets are thrown away before subtracting; the
      fix must also treat offset-less timestamps as UTC (naive/aware
      subtraction raises). Visible tests. The tests pin the local zone to
      UTC+05:30 (the acceptance env sets no TZ), so reading an offset-less
      timestamp as local time fails on every host, a UTC one included.
    prompt: >
      elapsed_minutes in {workspace}/timelog.py gives wrong answers when the two
      timestamps carry different UTC offsets. Fix it so it does what its
      docstring says and the tests in test_timelog.py pass. You can run them
      with `python3 -m unittest -q test_timelog`.
    setup_files:
      timelog.py: |
        from datetime import datetime


        def elapsed_minutes(start, end):
            """Whole minutes from start to end.

            Both are ISO-8601 timestamps such as "2026-03-08T01:30:00-05:00".
            They may carry different UTC offsets (a shift can cross a DST
            change, or be logged from another office). A timestamp without an
            offset is in UTC.
            """
            a = datetime.fromisoformat(start).replace(tzinfo=None)
            b = datetime.fromisoformat(end).replace(tzinfo=None)
            return int((b - a).total_seconds() // 60)
      test_timelog.py: &fe_timelog_tests |
        import os
        import time
        import unittest
        from datetime import datetime, timedelta

        # Pin the local time zone to UTC+05:30 (POSIX writes the sign inverted)
        # so these tests give the same result on every machine.
        os.environ["TZ"] = "IST-5:30"
        time.tzset()

        from timelog import elapsed_minutes  # noqa: E402


        class Elapsed(unittest.TestCase):
            def test_local_zone_is_pinned(self):
                # Not a timelog test: proves the pin above is still in effect.
                self.assertEqual(datetime(2026, 5, 11, 12, 0).astimezone().utcoffset(),
                                 timedelta(hours=5, minutes=30))

            def test_same_offset(self):
                self.assertEqual(
                    elapsed_minutes("2026-04-02T09:00:00+02:00", "2026-04-02T17:30:00+02:00"), 510)

            def test_across_a_dst_change(self):
                # 01:30 EST to 03:30 EDT is one real hour.
                self.assertEqual(
                    elapsed_minutes("2026-03-08T01:30:00-05:00", "2026-03-08T03:30:00-04:00"), 60)

            def test_different_offices(self):
                self.assertEqual(
                    elapsed_minutes("2026-05-11T08:00:00+01:00", "2026-05-11T09:15:00-04:00"), 375)

            def test_no_offset_means_utc(self):
                self.assertEqual(
                    elapsed_minutes("2026-05-11T12:00:00", "2026-05-11T14:45:00+02:00"), 45)
                self.assertEqual(
                    elapsed_minutes("2026-05-11T12:00:00", "2026-05-11T12:30:00"), 30)


        if __name__ == "__main__":
            unittest.main()
    acceptance: "{unittest} test_timelog"
    acceptance_files:
      test_timelog.py: *fe_timelog_tests
