      Change IntervalSet in {workspace}/intervals.py:

      1. spans() must always return the smallest list of (start, end) tuples
         that covers exactly the integers added so far, sorted by start. After
         any sequence of add() calls, intervals that overlap or touch (one ends
         at n and the next starts at n + 1) are merged into one.
      2. Add a method total() that returns how many distinct integers the set
         contains (0 for an empty set).

      add(), __contains__ and the ValueError for start > end keep their current
