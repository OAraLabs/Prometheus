          import sys
          from datetime import date

          from query import filter_entries, load_entries, total_minutes


          def _day(text):
              try:
                  return date.fromisoformat(text)
              except ValueError:
                  raise argparse.ArgumentTypeError(f"not a YYYY-MM-DD date: {text!r}") from None


          def build_parser():
              p = argparse.ArgumentParser(prog="worklog")
              p.add_argument("logfile")
              p.add_argument("--tag", help="only entries whose note has #TAG")
              p.add_argument("--since", type=_day, help="only entries on or after YYYY-MM-DD")
              return p


          def main(argv=None):
              args = build_parser().parse_args(argv)
              with open(args.logfile) as fh:
                  entries = load_entries(fh)
              picked = filter_entries(entries, tag=args.tag, since=args.since)
              print(f"{len(picked)} entries, {total_minutes(picked)} minutes")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
      wrong_files:
        # --since treated as exclusive (after, not on or after).
        - query.py: |
            from datetime import date


            def load_entries(lines):
                out = []
                for line in lines:
                    line = line.rstrip("\n")
                    if not line.strip():
                        continue
                    day, minutes, note = line.split("\t", 2)
                    out.append({"day": date.fromisoformat(day), "minutes": int(minutes), "note": note})
                return out


            def filter_entries(entries, tag=None, since=None):
                out = list(entries)
                if tag is not None:
                    out = [e for e in out if f"#{tag}" in e["note"].split()]
                if since is not None:
                    out = [e for e in out if e["day"] > since]
                return out


            def total_minutes(entries):
                return sum(e["minutes"] for e in entries)
