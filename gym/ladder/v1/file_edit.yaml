        import re
        import unittest
        from pathlib import Path


        def parse(text):
            """The block-mapping subset of YAML this file uses: `key: value`, nesting by indent."""
            root = {}
            stack = [(-1, root)]
            for raw in text.splitlines():
                if not raw.strip() or raw.lstrip().startswith("#"):
                    continue
                line = re.sub(r"\s+#.*$", "", raw).rstrip()
                indent = len(line) - len(line.lstrip(" "))
                key, _, value = line.strip().partition(":")
                value = value.strip().strip("\"'")
                while stack[-1][0] >= indent:
                    stack.pop()
                parent = stack[-1][1]
                if value:
                    parent[key.strip()] = value
                else:
                    child = {}
                    parent[key.strip()] = child
                    stack.append((indent, child))
            return root


        EXPECTED = {
            "defaults": {"replicas": "2", "memory_mb": "512"},
            "services": {
                "api": {"image": "ferrous/api:4.12.0", "replicas": "2", "memory_mb": "1024"},
                "ingest": {"image": "ferrous/ingest:4.12.2", "replicas": "5", "memory_mb": "768"},
                "scheduler": {"image": "ferrous/scheduler:4.11.3", "replicas": "1"},
            },
        }


        class Services(unittest.TestCase):
            def test_tree(self):
                self.assertEqual(parse(Path("deploy/services.yaml").read_text()), EXPECTED)


        if __name__ == "__main__":
            unittest.main()
