# Class: file edits with an acceptance command. The harness runs the command
# after the agent stops; acceptance_files restore pristine tests first.
class: file_edit
tasks:
  - id: fe-fix-last-n
    difficulty: easy
    smoke: true
    prompt: >
      The function last_n in {workspace}/textutil.py returns one element too few. Fix it so
      the tests in test_textutil.py pass. You can run them with
      `python3 -m unittest -q test_textutil`.
    setup_files:
      textutil.py: |
        def last_n(items, n):
            """Return the last n items of a list (all of them if n >= len)."""
            if n <= 0:
                return []
            return items[-(n - 1):]
      test_textutil.py: &fe_last_n_tests |
        import unittest
        from textutil import last_n


        class LastN(unittest.TestCase):
            def test_basic(self):
                self.assertEqual(last_n([1, 2, 3, 4], 2), [3, 4])

            def test_more_than_len(self):
                self.assertEqual(last_n([1, 2], 5), [1, 2])

            def test_just_over_len(self):
                self.assertEqual(last_n([1, 2], 3), [1, 2])
                self.assertEqual(last_n([1, 2, 3], 5), [1, 2, 3])

            def test_zero(self):
                self.assertEqual(last_n([1, 2], 0), [])

            def test_one(self):
                self.assertEqual(last_n(["a", "b", "c"], 1), ["c"])


        if __name__ == "__main__":
            unittest.main()
    acceptance: "{unittest} test_textutil"
    acceptance_files:
      test_textutil.py: *fe_last_n_tests
    reference:
      files:
        textutil.py: |
          def last_n(items, n):
              """Return the last n items of a list (all of them if n >= len)."""
              if n <= 0:
                  return []
              return items[-n:]
      wrong_files:
        # over-correction: one element too many
        - textutil.py: |
            def last_n(items, n):
                """Return the last n items of a list (all of them if n >= len)."""
                if n <= 0:
                    return []
                return items[-n - 1:]
        # len(items) - n goes negative and WRAPS when len < n < 2*len:
        # last_n([1, 2], 3) -> [2]. Only n >= 2*len clamps to the whole list.
        - textutil.py: |
            def last_n(items, n):
                """Return the last n items of a list (all of them if n >= len)."""
                if n <= 0:
                    return []
                return items[len(items) - n:]

  # ---------------------------------------------------------------- easy
  - id: fe-free-shipping-threshold
    difficulty: easy
    notes: "easy — wrong comparison (> instead of >=); visible tests."
    prompt: >
      Customers report being charged shipping on orders that should ship free.
      Fix the bug in {workspace}/shipping.py so the tests in test_shipping.py
      pass. You can run them with `python3 -m unittest -q test_shipping`.
    setup_files:
      shipping.py: |
        FREE_SHIPPING_MIN = 50.00
        FLAT_FEE = 4.95


        def shipping_fee(subtotal):
            """Shipping fee for an order subtotal.

            Orders of FREE_SHIPPING_MIN or more ship free; every other order
            pays FLAT_FEE.
            """
            if subtotal > FREE_SHIPPING_MIN:
                return 0.0
            return FLAT_FEE
      test_shipping.py: &fe_shipping_tests |
        import unittest

        from shipping import shipping_fee


        class ShippingFee(unittest.TestCase):
            def test_small_order_pays(self):
                self.assertEqual(shipping_fee(12.40), 4.95)

            def test_large_order_is_free(self):
                self.assertEqual(shipping_fee(80.00), 0.0)

            def test_exactly_the_threshold_is_free(self):
                self.assertEqual(shipping_fee(50.00), 0.0)

            def test_just_below_the_threshold_pays(self):
                self.assertEqual(shipping_fee(49.99), 4.95)


        if __name__ == "__main__":
            unittest.main()
    acceptance: "{unittest} test_shipping"
    acceptance_files:
      test_shipping.py: *fe_shipping_tests
    reference:
      files:
        shipping.py: |
          FREE_SHIPPING_MIN = 50.00
          FLAT_FEE = 4.95


          def shipping_fee(subtotal):
              """Shipping fee for an order subtotal.

              Orders of FREE_SHIPPING_MIN or more ship free; every other order
              pays FLAT_FEE.
              """
              if subtotal >= FREE_SHIPPING_MIN:
                  return 0.0
              return FLAT_FEE
      wrong_files:
        # Lowered the threshold instead of fixing the comparison: 49.99 ships free.
        - shipping.py: |
            FREE_SHIPPING_MIN = 49.00
            FLAT_FEE = 4.95


            def shipping_fee(subtotal):
                """Shipping fee for an order subtotal.

                Orders of FREE_SHIPPING_MIN or more ship free; every other order
                pays FLAT_FEE.
                """
                if subtotal > FREE_SHIPPING_MIN:
                    return 0.0
                return FLAT_FEE

  - id: fe-contact-label-key
    difficulty: easy
    notes: "easy — wrong dict key; visible tests."
    prompt: >
      mailing_label in {workspace}/contacts.py raises a KeyError for every
      contact. Fix it so the tests in test_contacts.py pass. You can run them
      with `python3 -m unittest -q test_contacts`.
    setup_files:
      contacts.py: |
        def load_contacts(rows):
            """Turn [name, email, city] rows into contact dicts."""
            return [{"name": n, "email": e, "city": c} for n, e, c in rows]


        def mailing_label(record):
            """One-line label for a contact dict made by load_contacts()."""
            return f"{record['name']} <{record['e-mail']}> ({record['city']})"
      test_contacts.py: &fe_contacts_tests |
        import unittest

        from contacts import load_contacts, mailing_label


        class Labels(unittest.TestCase):
            def test_label(self):
                rec = {"name": "Ivo Tarrant", "email": "ivo@mail.example", "city": "Fennick"}
                self.assertEqual(mailing_label(rec), "Ivo Tarrant <ivo@mail.example> (Fennick)")

            def test_from_rows(self):
                recs = load_contacts([["Suvi Okal", "suvi@mail.example", "Brannow"]])
                self.assertEqual(mailing_label(recs[0]), "Suvi Okal <suvi@mail.example> (Brannow)")


        if __name__ == "__main__":
            unittest.main()
    acceptance: "{unittest} test_contacts"
    acceptance_files:
      test_contacts.py: *fe_contacts_tests
    reference:
      files:
        contacts.py: |
          def load_contacts(rows):
              """Turn [name, email, city] rows into contact dicts."""
              return [{"name": n, "email": e, "city": c} for n, e, c in rows]


          def mailing_label(record):
              """One-line label for a contact dict made by load_contacts()."""
              return f"{record['name']} <{record['email']}> ({record['city']})"
      wrong_files:
        # "Fixed" the producer instead of the reader: load_contacts emits "e-mail".
        - contacts.py: |
            def load_contacts(rows):
                """Turn [name, email, city] rows into contact dicts."""
                return [{"name": n, "e-mail": e, "city": c} for n, e, c in rows]


            def mailing_label(record):
                """One-line label for a contact dict made by load_contacts()."""
