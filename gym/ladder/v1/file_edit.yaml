                self.assertEqual(len(store.fetch_rows_for_accounts(["ops-7731", "rnd-2204"])), 3)
                code, out = run_cli("rows-any", "rnd-2204")
                self.assertEqual((code, out), (0, "('rnd-2204', -300, 'coffee')\n"))

