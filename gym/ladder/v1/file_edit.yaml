  - id: fe-word-count-ignore-case
    difficulty: easy
    notes: "easy — add one keyword argument to an existing function; hidden tests."
    prompt: >
      Add a keyword argument ignore_case to word_counts in
      {workspace}/wordstats.py, defaulting to False. When it is True, every word
      is lowercased before it is counted, so "The" and "the" are counted
      together under the key "the". With the default, the behaviour must not
      change.
    setup_files:
      wordstats.py: |
        import re

        _WORD = re.compile(r"[A-Za-z']+")


        def word_counts(text):
            """Count how often each word occurs in text.

            Words are runs of letters and apostrophes. Returns a dict
            mapping word -> count.
            """
            counts = {}
            for word in _WORD.findall(text):
                counts[word] = counts.get(word, 0) + 1
            return counts
    acceptance: "{unittest} hidden_test_wordstats"
    acceptance_files:
      hidden_test_wordstats.py: |
        import unittest

        from wordstats import word_counts

        TEXT = "The owl and the Owl's twin saw THE owl"


        class WordCounts(unittest.TestCase):
            def test_default_is_case_sensitive(self):
                self.assertEqual(
                    word_counts(TEXT),
                    {"The": 1, "owl": 2, "and": 1, "the": 1, "Owl's": 1, "twin": 1,
                     "saw": 1, "THE": 1},
                )

            def test_explicit_false(self):
                self.assertEqual(word_counts("A a", ignore_case=False), {"A": 1, "a": 1})

            def test_ignore_case(self):
                self.assertEqual(
                    word_counts(TEXT, ignore_case=True),
                    {"the": 3, "owl": 2, "and": 1, "owl's": 1, "twin": 1, "saw": 1},
                )

            def test_empty(self):
                self.assertEqual(word_counts("", ignore_case=True), {})


        if __name__ == "__main__":
            unittest.main()
    reference:
      files:
        wordstats.py: |
          import re

          _WORD = re.compile(r"[A-Za-z']+")


          def word_counts(text, ignore_case=False):
              """Count how often each word occurs in text.

              Words are runs of letters and apostrophes. Returns a dict
              mapping word -> count. With ignore_case=True words are
              lowercased before counting.
              """
              counts = {}
              for word in _WORD.findall(text):
                  if ignore_case:
                      word = word.lower()
                  counts[word] = counts.get(word, 0) + 1
              return counts
      wrong_files:
        # Lowercases always, so the default behaviour changed.
        - wordstats.py: |
            import re

            _WORD = re.compile(r"[A-Za-z']+")


            def word_counts(text, ignore_case=False):
                counts = {}
                for word in _WORD.findall(text):
                    word = word.lower()
                    counts[word] = counts.get(word, 0) + 1
                return counts
        # Lowercases the keys afterwards: merged keys overwrite instead of adding up.
        - wordstats.py: |
            import re

            _WORD = re.compile(r"[A-Za-z']+")


            def word_counts(text, ignore_case=False):
                counts = {}
                for word in _WORD.findall(text):
                    counts[word] = counts.get(word, 0) + 1
                if ignore_case:
                    counts = {w.lower(): n for w, n in counts.items()}
                return counts

  # -------------------------------------------------------------- medium
  - id: fe-mutable-default-tags
    difficulty: medium
    smoke: true
    notes: "medium — mutable default argument that also mutates the caller's list; visible tests (they pin append order, so a set-based fix fails)."
    prompt: >
      add_tag in {workspace}/tagging.py gives wrong results when it is called
      more than once, and it changes lists passed to it. Fix it so it behaves
      as its docstring says and the tests in test_tagging.py pass. You can run
      them with `python3 -m unittest -q test_tagging`.
    setup_files:
      tagging.py: |
        def add_tag(tag, tags=[]):
            """Return a list of tags with tag appended (no duplicates).

            If tags is given, a NEW list is returned and the argument is left
            unchanged; if it is omitted, the result is a list holding just tag.
            """
            if tag not in tags:
                tags.append(tag)
            return tags
      test_tagging.py: &fe_tagging_tests |
        import unittest

        from tagging import add_tag


        class AddTag(unittest.TestCase):
            def test_fresh_list_on_every_call(self):
                self.assertEqual(add_tag("urgent"), ["urgent"])
                self.assertEqual(add_tag("billing"), ["billing"])
                self.assertEqual(add_tag("urgent"), ["urgent"])

            def test_argument_is_not_changed(self):
                existing = ["red"]
                result = add_tag("blue", existing)
                self.assertEqual(result, ["red", "blue"])
                self.assertEqual(existing, ["red"])
                self.assertIsNot(result, existing)

            def test_no_duplicates(self):
                existing = ["red", "green"]
                result = add_tag("red", existing)
                self.assertEqual(result, ["red", "green"])
                # Still a NEW list, even when nothing was added.
                self.assertIsNot(result, existing)
                self.assertEqual(existing, ["red", "green"])

            def test_appends_at_the_end(self):
                self.assertEqual(add_tag("blue", ["red", "green"]), ["red", "green", "blue"])
                self.assertEqual(add_tag("a", ["d", "c", "b"]), ["d", "c", "b", "a"])
                tags = ["billing", "q3", "west", "vip", "renewal", "legal", "emea"]
                self.assertEqual(add_tag("urgent", tags), tags + ["urgent"])


        if __name__ == "__main__":
            unittest.main()
    acceptance: "{unittest} test_tagging"
    acceptance_files:
      test_tagging.py: *fe_tagging_tests
    reference:
      files:
        tagging.py: |
          def add_tag(tag, tags=None):
              """Return a list of tags with tag appended (no duplicates).

              If tags is given, a NEW list is returned and the argument is left
              unchanged; if it is omitted, the result is a list holding just tag.
              """
              result = list(tags) if tags is not None else []
              if tag not in result:
                  result.append(tag)
              return result
      wrong_files:
        # Fixed the shared default, but still appends to the caller's list.
        - tagging.py: |
            def add_tag(tag, tags=None):
                """Return a list of tags with tag appended (no duplicates).

                If tags is given, a NEW list is returned and the argument is left
                unchanged; if it is omitted, the result is a list holding just tag.
                """
                if tags is None:
                    tags = []
                if tag not in tags:
                    tags.append(tag)
                return tags
        # Copies only when it adds: a duplicate returns the CALLER's list, so a
        # later append to the result still changes the argument.
        - tagging.py: |
            def add_tag(tag, tags=None):
                """Return a list of tags with tag appended (no duplicates).

                If tags is given, a NEW list is returned and the argument is left
                unchanged; if it is omitted, the result is a list holding just tag.
                """
                tags = tags or []
                if tag in tags:
                    return tags
                return tags + [tag]
        # Set-based: new list, no duplicates, but the order is the set's, not
        # "tag appended". The acceptance runner's -I ignores PYTHONHASHSEED, so
        # string hashing is random per run: the old tests passed this under
        # 1453 of 4000 hash seeds, the two short cases in test_appends_at_the_end
        # alone under 26, and with its 8-tag case under none.
        - tagging.py: |
            def add_tag(tag, tags=None):
                """Return a list of tags with tag appended (no duplicates).

                If tags is given, a NEW list is returned and the argument is left
                unchanged; if it is omitted, the result is a list holding just tag.
                """
                return list(set(tags or []) | {tag})
        - tagging.py: |
            def add_tag(tag, tags=None):
                """Return a list of tags with tag appended (no duplicates).

                If tags is given, a NEW list is returned and the argument is left
                unchanged; if it is omitted, the result is a list holding just tag.
                """
                return list(set((tags or []) + [tag]))

  - id: fe-changelog-unreleased-fixed
    difficulty: medium
    notes: >
      medium — place an entry in the right release and create the missing
      subsection; hidden check pins the whole Unreleased block (so #412 must
      stay under Added) and proves nothing else in the file changed (against a
      pristine copy written at check time).
    prompt: |
      Record this fix in {workspace}/CHANGELOG.md, under the Unreleased release,
      in a "### Fixed" section. The Unreleased release has no Fixed section
