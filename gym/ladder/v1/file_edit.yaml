        import unittest
        from pathlib import Path

        import ledgerkit
        from ledgerkit import balances, cli, statements, store

        OLD = re.compile(r"\bfetch_rows_for_account\b")


        def run_cli(*argv):
            buf = io.StringIO()
            with contextlib.redirect_stdout(buf):
                code = cli.main(list(argv))
            return code, buf.getvalue()


        class Rename(unittest.TestCase):
            def setUp(self):
                store.clear()
                store.post("ops-7731", 12500, "seed")
                store.post("rnd-2204", -300, "coffee")
                store.post("ops-7731", -4250, "")

            def test_new_name(self):
