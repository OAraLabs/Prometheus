        from datetime import date


        def load_entries(lines):
            """Parse "YYYY-MM-DD<TAB>minutes<TAB>note" lines into dicts."""
            out = []
            for line in lines:
                line = line.rstrip("\n")
                if not line.strip():
                    continue
                day, minutes, note = line.split("\t", 2)
                out.append({"day": date.fromisoformat(day), "minutes": int(minutes), "note": note})
            return out


        def filter_entries(entries, tag=None):
            """Entries whose note has the word #tag (all entries if tag is None)."""
            if tag is None:
                return list(entries)
            return [e for e in entries if f"#{tag}" in e["note"].split()]


        def total_minutes(entries):
            return sum(e["minutes"] for e in entries)
