          import re

          _UNITS = {"s": 1, "m": 60, "h": 3600, "d": 86400}
          _ORDER = "dhms"
          _PART = re.compile(r"([0-9]+)([dhms])")


          def parse_duration(text):
              """Parse "90s", "15m", "1h30m", "2d 4h", "1h 0m 5s" ... into seconds (int).

              Parts are a number and a unit (d, h, m, s), in that order, each
              unit at most once, optionally separated by spaces. Raises
              ValueError for anything else.
              """
              s = text.strip()
              if not s:
                  raise ValueError(f"bad duration: {text!r}")
              total = 0
              last = -1
              pos = 0
              while pos < len(s):
                  m = _PART.match(s, pos)
                  if not m:
                      raise ValueError(f"bad duration: {text!r}")
                  rank = _ORDER.index(m.group(2))
                  if rank <= last:
                      raise ValueError(f"bad duration: {text!r}")
                  last = rank
                  total += int(m.group(1)) * _UNITS[m.group(2)]
                  pos = m.end()
                  while pos < len(s) and s[pos] == " ":
                      pos += 1
              return total
