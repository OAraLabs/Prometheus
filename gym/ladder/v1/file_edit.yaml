  - id: fe-slugify-max-length
    difficulty: medium
    notes: "medium — add an optional parameter with exact truncation rules; hidden tests."
    prompt: |
      Add an optional parameter max_length to slugify in {workspace}/slug.py.

      - The default is None, meaning no limit (the current behaviour).
      - When max_length is given and the full slug is longer than that, cut the
        slug to its first max_length characters, then strip any hyphens left at
        the end of the cut slug.
      - max_length must be at least 1; for max_length < 1 raise ValueError.
    setup_files:
      slug.py: |
        import re
        import unicodedata


        def slugify(text):
            """Turn text into a URL slug.

            ASCII-folds accented letters, lowercases, replaces every run of
            characters other than a-z and 0-9 with one hyphen, and strips
            leading and trailing hyphens.
            """
            text = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode()
            text = re.sub(r"[^a-z0-9]+", "-", text.lower())
            return text.strip("-")
    acceptance: "{unittest} hidden_test_slug"
    acceptance_files:
      hidden_test_slug.py: |
        import unittest

        from slug import slugify


        class MaxLength(unittest.TestCase):
            def test_default_unchanged(self):
                self.assertEqual(slugify("  Hello, World!  "), "hello-world")
                self.assertEqual(slugify("Hello World", max_length=None), "hello-world")

            def test_cut(self):
                self.assertEqual(slugify("Hello World", max_length=5), "hello")
                self.assertEqual(slugify("Hello World", max_length=8), "hello-wo")

            def test_cuts_the_slug_not_the_input(self):
                self.assertEqual(slugify("Hello,   World", max_length=8), "hello-wo")

            def test_cut_on_hyphen_strips_it(self):
                self.assertEqual(slugify("Hello World", max_length=6), "hello")
                self.assertEqual(slugify("Crème brûlée -- recipe", max_length=13), "creme-brulee")

            def test_long_enough_is_whole(self):
                self.assertEqual(slugify("Hello World", max_length=11), "hello-world")
                self.assertEqual(slugify("Hello World", max_length=50), "hello-world")

            def test_invalid(self):
                for bad in (0, -3):
                    with self.assertRaises(ValueError):
                        slugify("Hello World", max_length=bad)


        if __name__ == "__main__":
            unittest.main()
    reference:
      files:
        slug.py: |
          import re
          import unicodedata


          def slugify(text, max_length=None):
              """Turn text into a URL slug.

              ASCII-folds accented letters, lowercases, replaces every run of
              characters other than a-z and 0-9 with one hyphen, and strips
              leading and trailing hyphens. With max_length, the slug is cut to
              that many characters and any trailing hyphens are stripped.
              """
              if max_length is not None and max_length < 1:
                  raise ValueError("max_length must be at least 1")
              text = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode()
              text = re.sub(r"[^a-z0-9]+", "-", text.lower())
              slug = text.strip("-")
              if max_length is not None and len(slug) > max_length:
                  slug = slug[:max_length].rstrip("-")
              return slug
