        class IntervalSet:
            """A set of integers stored as closed intervals [start, end]."""

            def __init__(self):
                self._spans = []

            def add(self, start, end):
                """Add every integer from start to end, inclusive."""
                if start > end:
                    raise ValueError(f"start {start} > end {end}")
                self._spans.append((start, end))

            def spans(self):
                """The stored intervals as a list of (start, end) tuples."""
                return list(self._spans)

            def __contains__(self, n):
                return any(s <= n <= e for s, e in self._spans)
