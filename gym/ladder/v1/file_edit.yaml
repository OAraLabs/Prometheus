  - id: fe-average-rating-division
    difficulty: easy
    notes: "easy — integer division where true division is meant; visible tests."
    prompt: >
      average_rating in {workspace}/ratings.py returns 4 for the scores [4, 5]
      instead of 4.5. Fix it so the tests in test_ratings.py pass. You can run
      them with `python3 -m unittest -q test_ratings`.
    setup_files:
      ratings.py: |
        def average_rating(scores):
            """Mean of a list of 1-5 star scores, rounded to 2 decimals.

            Returns 0.0 for an empty list.
            """
            if not scores:
                return 0.0
            return round(sum(scores) // len(scores), 2)
      test_ratings.py: &fe_ratings_tests |
        import unittest

        from ratings import average_rating


        class Average(unittest.TestCase):
            def test_half(self):
                self.assertEqual(average_rating([4, 5]), 4.5)

            def test_rounded(self):
                self.assertEqual(average_rating([5, 4, 4]), 4.33)

            def test_single(self):
                self.assertEqual(average_rating([3]), 3.0)

            def test_empty(self):
                self.assertEqual(average_rating([]), 0.0)


        if __name__ == "__main__":
            unittest.main()
    acceptance: "{unittest} test_ratings"
    acceptance_files:
      test_ratings.py: *fe_ratings_tests
    reference:
      files:
        ratings.py: |
          def average_rating(scores):
              """Mean of a list of 1-5 star scores, rounded to 2 decimals.

              Returns 0.0 for an empty list.
              """
              if not scores:
                  return 0.0
              return round(sum(scores) / len(scores), 2)
      wrong_files:
        # True division, but rounded to a whole number.
        - ratings.py: |
            def average_rating(scores):
                """Mean of a list of 1-5 star scores, rounded to 2 decimals.

                Returns 0.0 for an empty list.
                """
                if not scores:
                    return 0.0
                return round(sum(scores) / len(scores))
        # Floor division cast to float: 4.0, not 4.5.
        - ratings.py: |
            def average_rating(scores):
                """Mean of a list of 1-5 star scores, rounded to 2 decimals.

                Returns 0.0 for an empty list.
                """
                if not scores:
                    return 0.0
                return round(float(sum(scores) // len(scores)), 2)

  - id: fe-service-json-retries
    difficulty: easy
    notes: >
      easy — two value edits in a nested JSON config; hidden check compares the
      whole document type-strictly (true is not 1, 11 is not 11.0) and rejects
      duplicate keys (an added "max_retries": 11 beside the old 3 is not an edit).
    prompt: >
      In {workspace}/config/service.json, set the queue's max_retries to 11 and
      turn shadow_writes on. Leave every other setting exactly as it is; the
      file must stay valid JSON.
    setup_files:
      config/service.json: |
        {
          "service": "quillmark-indexer",
          "listen_port": 7342,
          "worker_pool_size": 6,
          "queue": {
            "name": "ingest-jobs",
            "max_retries": 3,
            "visibility_timeout_s": 45
          },
          "features": {
            "dedupe": true,
            "shadow_writes": false
          }
        }
    acceptance: "{unittest} hidden_check_service_json"
    acceptance_files:
      hidden_check_service_json.py: |
        import json
        import unittest
        from pathlib import Path

        EXPECTED = {
            "service": "quillmark-indexer",
            "listen_port": 7342,
            "worker_pool_size": 6,
            "queue": {"name": "ingest-jobs", "max_retries": 11, "visibility_timeout_s": 45},
            "features": {"dedupe": True, "shadow_writes": True},
        }


        def _no_duplicate_keys(pairs):
            # json.loads silently keeps the LAST of two equal keys.
            keys = [k for k, _ in pairs]
            dupes = sorted({k for k in keys if keys.count(k) > 1})
            if dupes:
                raise AssertionError(f"duplicate keys in one object: {dupes}")
            return dict(pairs)


        class ServiceConfig(unittest.TestCase):
            def test_config(self):
                data = json.loads(Path("config/service.json").read_text(),
                                  object_pairs_hook=_no_duplicate_keys)
                self.assertEqual(data, EXPECTED)
                # == treats 1 as True and 11.0 as 11; the JSON text does not.
                self.assertEqual(json.dumps(data, sort_keys=True, indent=1),
                                 json.dumps(EXPECTED, sort_keys=True, indent=1))


        if __name__ == "__main__":
            unittest.main()
    reference:
      files:
        config/service.json: |
          {
            "service": "quillmark-indexer",
            "listen_port": 7342,
            "worker_pool_size": 6,
            "queue": {
              "name": "ingest-jobs",
              "max_retries": 11,
              "visibility_timeout_s": 45
            },
            "features": {
              "dedupe": true,
              "shadow_writes": true
            }
          }
      wrong_files:
        # shadow_writes set to the string "true", not the boolean.
        - config/service.json: |
            {
              "service": "quillmark-indexer",
              "listen_port": 7342,
              "worker_pool_size": 6,
              "queue": {
                "name": "ingest-jobs",
                "max_retries": 11,
                "visibility_timeout_s": 45
              },
              "features": {
                "dedupe": true,
                "shadow_writes": "true"
              }
            }
        # Only max_retries changed.
        - config/service.json: |
            {
              "service": "quillmark-indexer",
              "listen_port": 7342,
              "worker_pool_size": 6,
              "queue": {
                "name": "ingest-jobs",
                "max_retries": 11,
                "visibility_timeout_s": 45
              },
              "features": {
                "dedupe": true,
                "shadow_writes": false
              }
            }
        # shadow_writes set to the integer 1, not the boolean (1 == True in Python).
        - config/service.json: |
            {
              "service": "quillmark-indexer",
              "listen_port": 7342,
              "worker_pool_size": 6,
              "queue": {
                "name": "ingest-jobs",
                "max_retries": 11,
                "visibility_timeout_s": 45
              },
              "features": {
                "dedupe": true,
                "shadow_writes": 1
              }
            }
        # max_retries written as the float 11.0 (11.0 == 11 in Python).
        - config/service.json: |
            {
              "service": "quillmark-indexer",
              "listen_port": 7342,
              "worker_pool_size": 6,
              "queue": {
                "name": "ingest-jobs",
                "max_retries": 11.0,
                "visibility_timeout_s": 45
              },
              "features": {
                "dedupe": true,
                "shadow_writes": true
              }
            }
        # A second max_retries ADDED after the untouched 3; json.loads keeps the last.
        - config/service.json: |
            {
              "service": "quillmark-indexer",
              "listen_port": 7342,
              "worker_pool_size": 6,
              "queue": {
                "name": "ingest-jobs",
                "max_retries": 3,
                "max_retries": 11,
                "visibility_timeout_s": 45
              },
