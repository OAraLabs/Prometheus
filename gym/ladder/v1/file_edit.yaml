    difficulty: medium
    notes: >
      medium — multi-file: the registry key and class name live only in the
      new module, so the model must read it before editing the registry.
    prompt: >
      A new exporter lives in {workspace}/exporters/tsv_export.py, but
      get_exporter cannot find it. Register it in
      {workspace}/exporters/registry.py the same way the existing exporters
      are registered, so it can be looked up by its format name.
    setup_files:
      exporters/__init__.py: |
        """Output formats for `lumen export --format NAME`."""
      exporters/registry.py: |
        """Format name -> exporter class. `lumen export --format NAME` looks names up here."""

        from exporters.json_export import JsonExporter
        from exporters.markdown_export import MarkdownExporter

        REGISTRY = {
            JsonExporter.NAME: JsonExporter,
            MarkdownExporter.NAME: MarkdownExporter,
        }


        def get_exporter(name):
            try:
                return REGISTRY[name]()
            except KeyError:
                raise ValueError(f"unknown export format {name!r}") from None
      exporters/json_export.py: |
        import json


        class JsonExporter:
            NAME = "json"

            def render(self, rows):
                return json.dumps(rows, sort_keys=True)
      exporters/markdown_export.py: |
