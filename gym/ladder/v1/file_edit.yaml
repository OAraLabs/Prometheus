              dt = datetime.fromisoformat(ts)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt


          def elapsed_minutes(start, end):
              """Whole minutes from start to end.

              Both are ISO-8601 timestamps such as "2026-03-08T01:30:00-05:00".
              They may carry different UTC offsets (a shift can cross a DST
              change, or be logged from another office). A timestamp without an
              offset is in UTC.
              """
