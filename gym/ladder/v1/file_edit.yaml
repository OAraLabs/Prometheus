        import argparse
        import sys

        from query import filter_entries, load_entries, total_minutes


        def build_parser():
            p = argparse.ArgumentParser(prog="worklog")
            p.add_argument("logfile")
            p.add_argument("--tag", help="only entries whose note has #TAG")
            return p


        def main(argv=None):
            args = build_parser().parse_args(argv)
            with open(args.logfile) as fh:
                entries = load_entries(fh)
            picked = filter_entries(entries, tag=args.tag)
            print(f"{len(picked)} entries, {total_minutes(picked)} minutes")
            return 0


        if __name__ == "__main__":
            sys.exit(main())
