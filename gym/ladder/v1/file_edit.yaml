    difficulty: hard
    notes: >
      hard — extend a parser to a small grammar with ordering and error rules;
      hidden tests. They reject a space inside a part ("1 h", "1 0m"), so
      stripping every space before one fullmatch fails.
    prompt: |
      Extend parse_duration in {workspace}/durations.py so it also accepts
      compound durations such as "1h30m", "2d 4h" or "1h 0m 5s".

      - A duration is one or more parts. Each part is a non-negative integer
        immediately followed by one unit letter: d, h, m or s (lowercase only;
        1d = 86400 s, 1h = 3600 s, 1m = 60 s).
      - Parts may be separated by spaces. Leading and trailing whitespace is
        ignored.
      - Units must appear in the order d, h, m, s, and each unit at most once.
      - The result is the total number of seconds, as an int.

      Anything else raises ValueError — including an empty or all-blank
      string, a number without a unit, a unit without a number, an unknown or
      uppercase unit, a repeated unit, and units out of order such as "30m1h".
      Single-part inputs like "90s" and "15m" must keep working.
    setup_files:
      durations.py: |
        import re

        _UNITS = {"s": 1, "m": 60, "h": 3600, "d": 86400}


        def parse_duration(text):
            """Parse a duration like "90s", "15m", "2h" or "3d" into seconds (int).

            Raises ValueError for anything else.
            """
            m = re.fullmatch(r"\s*(\d+)([smhd])\s*", text)
            if not m:
                raise ValueError(f"bad duration: {text!r}")
            return int(m.group(1)) * _UNITS[m.group(2)]
