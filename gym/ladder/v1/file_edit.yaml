  - id: fe-lru-cache-recency
    difficulty: hard
    smoke: true
    notes: >
      hard — three separate bugs in one class (get does not refresh recency,
      put on an existing key does not either, eviction pops the newest key);
      visible tests. One test updates a present, not-least-recent key in a
      full cache, so a put() that evicts before checking presence fails.
    prompt: >
      The LRUCache in {workspace}/lru.py does not behave as its docstrings say.
      Fix it so the tests in test_lru.py pass, keeping the public API unchanged.
      You can run them with `python3 -m unittest -q test_lru`.
    setup_files:
      lru.py: |
        from collections import OrderedDict


        class LRUCache:
            """A fixed-capacity cache that evicts the least recently used key.

            Both get() of a present key and put() count as a use of that key.
            """

            def __init__(self, capacity):
                if capacity < 1:
                    raise ValueError("capacity must be >= 1")
                self.capacity = capacity
                self._data = OrderedDict()

            def get(self, key, default=None):
                if key not in self._data:
                    return default
                return self._data[key]

            def put(self, key, value):
                self._data[key] = value
                if len(self._data) > self.capacity:
                    self._data.popitem(last=True)

            def keys(self):
                """Keys from least to most recently used."""
                return list(self._data)
      test_lru.py: &fe_lru_tests |
        import unittest

        from lru import LRUCache


        class LRU(unittest.TestCase):
            def test_evicts_the_least_recent(self):
                c = LRUCache(2)
                c.put("a", 1)
                c.put("b", 2)
                c.put("c", 3)
                self.assertIsNone(c.get("a"))
                self.assertEqual(c.get("b"), 2)
                self.assertEqual(c.get("c"), 3)

            def test_get_refreshes(self):
                c = LRUCache(2)
                c.put("a", 1)
                c.put("b", 2)
                c.get("a")
                c.put("c", 3)
                self.assertEqual(c.keys(), ["a", "c"])

            def test_put_existing_refreshes(self):
                c = LRUCache(2)
                c.put("a", 1)
                c.put("b", 2)
                c.put("a", 10)
                c.put("c", 3)
                self.assertEqual(c.keys(), ["a", "c"])
                self.assertEqual(c.get("a"), 10)

            def test_update_in_full_cache_keeps_others(self):
                # Updating a present key never evicts: nothing grew.
                c = LRUCache(2)
                c.put("a", 1)
                c.put("b", 2)
                c.put("b", 20)
                self.assertEqual(c.keys(), ["a", "b"])
                self.assertEqual(c.get("a"), 1)
                self.assertEqual(c.get("b"), 20)

            def test_keys_order(self):
                c = LRUCache(3)
                for k in "xyz":
                    c.put(k, k.upper())
                c.get("x")
                self.assertEqual(c.keys(), ["y", "z", "x"])

            def test_missing_key(self):
                c = LRUCache(1)
                self.assertEqual(c.get("nope", 42), 42)
                self.assertEqual(c.keys(), [])

            def test_capacity_must_be_positive(self):
                with self.assertRaises(ValueError):
                    LRUCache(0)


        if __name__ == "__main__":
            unittest.main()
