        date (inclusive). It combines with --tag: when both are given, both
        filters apply.
      - In query.py, filter_entries gains a keyword argument since, default
        None. It takes a datetime.date (or None for no date filter).
      - An invalid --since value (anything that is not a real YYYY-MM-DD date,
        such as 2026-02-30 or yesterday) must make the CLI exit with status 2
        and an error message on stderr, the way argparse rejects bad
        arguments.
      - Without --since, the output must not change.
