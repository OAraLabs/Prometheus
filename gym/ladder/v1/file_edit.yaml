      hidden_check_settings_ini.py: |
        import configparser
        import unittest

        EXPECTED = {
            "server": {"port": "8315", "workers": "4"},
            "logging": {"level": "WARNING", "file": "logs/tallyhub.log"},
            "export": {"format": "csv", "compress": "false", "retention_days": "21"},
        }


        class Settings(unittest.TestCase):
            def test_settings(self):
