  - id: ms-profile-include-fallback
    difficulty: medium
    notes: >
      medium — pointer → profile → included base file for the key the profile
      does not set; day.ini's batch_size = 96 is the distractor, and a model that
      stops at night.ini finds no batch_size at all.
    prompt: >
      run.cfg names the active profile file. A profile may include another
      file; keys the profile sets itself win, and anything it does not set
      comes from the included file. What is the effective value of batch_size
      for the active profile? End your reply with a final line
      `ANSWER: <the batch_size value>`.
    setup_files:
      run.cfg: "profile = profiles/night.ini\n"
      profiles/night.ini: "include = profiles/base.ini\nworkers = 12\nqueue = night-lane-3\n"
      profiles/day.ini: "include = profiles/base.ini\nbatch_size = 96\nworkers = 8\n"
      profiles/base.ini: "batch_size = 3712\nworkers = 4\nqueue = default\n"
    score:
      expect_answer: '(batch_size\s*[:=]\s*)?3[, \u00a0\u202f]?712(\.0+)?'
      answer_shape: '(batch_size\s*[:=]\s*)?\d{1,3}([, \u00a0\u202f]?\d{3})*(\.\d+)?'
    reference:
      answer: "run.cfg points to profiles/night.ini. It does not set batch_size itself, so the value comes from its include, profiles/base.ini: batch_size = 3712.\n\nANSWER: 3712"
      tools: [read_file, read_file, read_file]
      wrong_answers:
        - "ANSWER: 96"  # day.ini's override
        - "The active profile is profiles/night.ini, which does not set batch_size, so it inherits 3712 from profiles/base.ini.\n\nANSWER: 96"  # right in prose, wrong answer line
        - "ANSWER: 12"  # night.ini's workers, not batch_size
        - "ANSWER: 37120"  # a digit too many
        - "ANSWER: 13,712"  # not the value
        - "96"  # no answer line, but a bare number: day.ini's override
      right_answers:
        - "ANSWER: 3712"
        - "run.cfg says profile = profiles/night.ini. night.ini sets workers = 12 and queue = night-lane-3 but no batch_size, so it falls through to its include, profiles/base.ini, which has batch_size = 3712. (profiles/day.ini sets batch_size = 96, but day is not the active profile.)\n\nANSWER: 3712"
        - "**ANSWER:** 3\u202f712"
        - "Final answer: batch_size = 3,712.0"
        - "ANSWER: $3712$"
        - "So the answer is 3712."  # no answer line: the bare last line is credited
        - "run.cfg -> night.ini -> base.ini.\n\n**Final Answer:**\n\\[\\boxed{3712}\\]"  # empty label, the value on the next line in \[ \]
        - "ANSWER: <3712>"  # the prompt's placeholder brackets, copied
        - "Final Answer: $\\boxed{3{,}712}$"  # LaTeX thousands separator
        - "run.cfg points to profiles/night.ini, which inherits batch_size = 3712 from profiles/base.ini."  # no answer line, but the one value in the prose is the right one: credited
      format_misses:
        - "ANSWER: 96 or 3712"  # hedged between the profiles: commits to neither
        - "The effective batch_size is 3712, inherited from profiles/base.ini because profiles/night.ini does not set it."  # no answer line; prose with a negation in it is not read as a commitment
        - "profiles/night.ini does not set batch_size, so it comes from the file it includes."  # no answer line, no clear answer

