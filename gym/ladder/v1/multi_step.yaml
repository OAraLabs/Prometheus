# Class: multi-step tool use — each step needs the previous step's result.
class: multi_step
tasks:
  - id: ms-find-csv-sum-write
    difficulty: easy
    smoke: true
    prompt: >
      Under data/, find the CSV file whose name contains "q3", add up its
      "amount" column, and write just the total (a plain number) to
      {workspace}/total.txt.
    setup_files:
      data/sales_q2.csv: "id,amount\n1,10\n2,20\n"
      data/sales_q3.csv: "id,amount\n1,125\n2,310\n3,47\n4,1000\n"
      data/notes.txt: "q3 numbers are provisional\n"
    score:
      expect_file: total.txt
      expect_file_regex: {path: total.txt, pattern: '\A\s*1482(\.0+)?\s*\Z'}
    reference:
      files: {total.txt: "1482\n"}
      tools: [glob, read_file, write_file]
      wrong_files:
        - {"total.txt": "30\n"}  # summed the q2 file
        - {"total.txt": "1512\n"}  # summed every CSV

  # ---------------------------------------------------------------- easy ---

  - id: ms-pointer-copy-line
    difficulty: easy
    notes: "easy — read a pointer file, open the file it names, write one line."
    prompt: >
      The file inbox/latest.txt holds the name of another file in inbox/. Open
      that file and write its third line, exactly as it appears, to
      {workspace}/third_line.txt.
    setup_files:
      inbox/latest.txt: "memo-0419.txt\n"
      inbox/memo-0418.txt: "From: ops-desk\nSubject: rollback\nrollback window closes at 04:00 for heron-vault-1180\nthanks\n"
      inbox/memo-0419.txt: "From: ops-desk\nSubject: rotation\nrotate the tern-cellar-6627 credentials before friday\nthanks\n"
      inbox/memo-0420.txt: "From: build-bot\nSubject: nightly\nnightly build 3310 is green\n"
    score:
      expect_file_regex:
        path: third_line.txt
        pattern: '\A\s*rotate the tern-cellar-6627 credentials before friday\s*\Z'
    reference:
      files: {third_line.txt: "rotate the tern-cellar-6627 credentials before friday\n"}
      tools: [read_file, read_file, write_file]
      wrong_files:
        - {"third_line.txt": "rollback window closes at 04:00 for heron-vault-1180\n"}  # neighbouring memo
        - {"third_line.txt": "Subject: rotation\n"}  # second line

  - id: ms-grep-key-owner
    difficulty: easy
    notes: >
      easy — search for the one file that sets a key, then read another field of
      it; export.ini only mentions retention in a comment, so a loose grep for
      "retention" lands on team-cormorant-9035.
    prompt: >
      Exactly one file under config/ sets retention_days. Find that file and
      tell me the value of the owner field in it. End your reply with a final
      line `ANSWER: <the owner>`.
    setup_files:
      config/ingest.ini: "[ingest]\nowner = team-pelican-2208\nbatch = 500\n"
      config/archive.ini: "[archive]\nowner = team-sandpiper-4471\nretention_days = 213\ncompress = true\n"
      config/export.ini: "[export]\nowner = team-cormorant-9035\nformat = parquet\n# retention is set elsewhere\n"
    score:
      expect_answer: '(owner\s*[:=]\s*)?team-sandpiper-4471'
      answer_shape: '(owner\s*[:=]\s*)?team-[a-z]+-\d+'
    reference:
      answer: "config/archive.ini is the only file that sets retention_days (= 213), and its owner field is team-sandpiper-4471.\n\nANSWER: team-sandpiper-4471"
      tools: [grep, read_file]
      wrong_answers:
        - "ANSWER: team-cormorant-9035"  # the grep trap: export.ini's retention comment
        - "config/archive.ini sets retention_days, and its owner is team-sandpiper-4471.\n\nANSWER: team-pelican-2208"  # right in prose, wrong answer line
        - "ANSWER: 213"  # the retention_days value, not the owner
        - "ANSWER: config/archive.ini"  # the file, not its owner
        - "team-cormorant-9035"  # no answer line, but a bare owner of the right shape: the grep trap
      right_answers:
        - "ANSWER: team-sandpiper-4471"
        - "grep for retention matches two files: config/export.ini (owner team-cormorant-9035) only has a comment, '# retention is set elsewhere', and config/ingest.ini (team-pelican-2208) does not mention it at all. config/archive.ini sets retention_days = 213, and its owner field is team-sandpiper-4471.\n\nANSWER: team-sandpiper-4471"
        - "**ANSWER:** `owner = team-sandpiper-4471`"
        - "Final answer: Team-Sandpiper-4471"
        - "config/archive.ini sets retention_days = 213.\n\nSo the answer is team-sandpiper-4471."  # no answer line: the bare last line is credited
        - "### Answer:\n`team-sandpiper-4471`"  # empty label, the value on the next line
        - "ANSWER: <team-sandpiper-4471>"  # the prompt's placeholder brackets, copied
        - "**ANSWER:** owner = `team-sandpiper-4471`"  # backticks round the value only
        - "ANSWER: team‑sandpiper‑4471"  # non-breaking hyphens
        - "config/archive.ini sets retention_days = 213; its owner is team-sandpiper-4471."  # no answer line, but the one owner in the prose is the right one: credited
      format_misses:
        - "ANSWER: team-sandpiper-4471, team-cormorant-9035"  # two owners on the line: commits to neither
        - "config/archive.ini sets retention_days and is owned by team-sandpiper-4471; config/export.ini, owned by team-cormorant-9035, only mentions retention in a comment."  # no answer line, two owners in the prose
        - "Two files mention retention (config/archive.ini and config/export.ini), so I can't tell which owner you mean."  # no answer line, no clear answer

  - id: ms-count-open-todos
    difficulty: easy
    notes: "easy — find the .todo file, count open items (not done ones, not the .md distractor)."
    prompt: >
      Under notes/, find the file whose name ends in .todo. Count the lines in
      it that start with "- [ ]" (open items; "- [x]" lines are done) and write
      just that count to {workspace}/open_count.txt.
    setup_files:
      notes/week37.md: "# week 37\n- [ ] draft the wren migration\n- [ ] book the quarry room\n- [ ] reply to the lantern survey\n"
      notes/week38.todo: |
        # week 38
        - [ ] rotate the staging keys
        - [x] merge the pelican patch
        - [ ] write the release notes for 4.2
        - [ ] fix the flaky ingest test
        - [x] archive the march reports
        - [ ] review the budget sheet
        - [ ] update the on-call rota
        - [ ] rename the orchid bucket
        - [x] close the stale tickets
        - [ ] ping the vendor about invoices
        - [ ] benchmark the new cache
        - [x] prune old branches
        - [ ] refresh the demo data
        - [ ] trim the dashboard panels
        - [ ] migrate the cron registry
        - [x] tag release 4.1
        - [ ] answer the audit questions
      notes/README.txt: "One file per week. .todo files are the live lists.\n"
    score:
      expect_file_regex: {path: open_count.txt, pattern: '\A\s*12\s*\Z'}
    reference:
      files: {open_count.txt: "12\n"}
      tools: [glob, read_file, write_file]
      wrong_files:
        - {"open_count.txt": "15\n"}  # counted the week37.md items too
        - {"open_count.txt": "17\n"}  # counted done items too

  - id: ms-glob-count-orders
    difficulty: easy
    notes: "easy — recursive find, then write the count. Near-miss names (orders_, order-, .bak, refund_) must not count."
    prompt: >
      How many files named order_*.json are there anywhere under fixtures/,
      including subfolders? Write just the number to
      {workspace}/order_count.txt.
    setup_files:
      fixtures/order_1001.json: "{\"id\": 1001}\n"
      fixtures/order_template.txt: "{\"id\": null}\n"
      fixtures/2026/order_1002.json: "{\"id\": 1002}\n"
      fixtures/2026/03/order_1003.json: "{\"id\": 1003}\n"
      fixtures/2026/03/order_1004.json: "{\"id\": 1004}\n"
      fixtures/2026/03/order_1005.json: "{\"id\": 1005}\n"
      fixtures/2026/03/order-1012.json: "{\"id\": 1012}\n"
      fixtures/2026/04/order_1006.json: "{\"id\": 1006}\n"
      fixtures/2026/04/order_1007.json: "{\"id\": 1007}\n"
      fixtures/2026/04/refund_1008.json: "{\"id\": 1008}\n"
      fixtures/archive/orders_summary.json: "{\"count\": 3}\n"
      fixtures/archive/old/order_0998.json: "{\"id\": 998}\n"
      fixtures/archive/old/order_0999.json: "{\"id\": 999}\n"
      fixtures/archive/old/order_0997.json.bak: "{\"id\": 997}\n"
      fixtures/drafts/order_1009.json: "{\"id\": 1009}\n"
      fixtures/drafts/order_1011.json: "{\"id\": 1011}\n"
    score:
      expect_file_regex: {path: order_count.txt, pattern: '\A\s*11\s*\Z'}
    reference:
      files: {order_count.txt: "11\n"}
      tools: [glob, write_file]
      wrong_files:
        - {"order_count.txt": "13\n"}  # counted order-1012 and orders_summary
        - {"order_count.txt": "12\n"}  # counted the hyphenated order-1012

  - id: ms-json-max-write
    difficulty: easy
    notes: "easy — locate the one JSON file, pick the max p99 (close runner-up, p50 distractor), write the name."
    prompt: >
      Somewhere under metrics/ there is exactly one JSON file. It lists
      services with their p50 and p99 latency in milliseconds. Write the name
      of the service with the highest p99 to {workspace}/slowest.txt (just the
      name).
    setup_files:
      metrics/README.txt: "Daily latency snapshots live in the daily/ folder.\n"
      metrics/daily/latency-0310.json: |
        {"window": "2026-03-10T00:00Z/24h",
         "services": [
          {"name": "atlas-gate", "p50": 41, "p99": 912},
          {"name": "tarn-index", "p50": 95, "p99": 1869},
          {"name": "brine-cache", "p50": 212, "p99": 1640},
          {"name": "quill-router", "p50": 38, "p99": 1873},
          {"name": "sable-auth", "p50": 17, "p99": 388}
         ]}
    score:
      expect_file_regex: {path: slowest.txt, pattern: '\A\s*quill-router\s*\Z'}
    reference:
      files: {slowest.txt: "quill-router\n"}
      tools: [glob, read_file, write_file]
      wrong_files:
        - {"slowest.txt": "tarn-index\n"}  # runner-up p99
        - {"slowest.txt": "brine-cache\n"}  # highest p50

  - id: ms-version-codename
    difficulty: easy
    notes: >
      easy — read VERSION, then look that exact version up in the changelog; the
      unreleased 2.15.0 entry on top and the other 2.14.x releases are the
      distractors.
    prompt: >
      Read the VERSION file to see which version is deployed, then look that
      version up in CHANGELOG.md and tell me its codename. End your reply with a
      final line `ANSWER: <the codename>`.
    setup_files:
      VERSION: "2.14.3\n"
      CHANGELOG.md: |
        # Changelog

        ## 2.15.0 (unreleased) — codename: marble-finch-91
        - new export queue

        ## 2.14.3 — codename: amber-lantern-58
        - fix the retry storm in the sync worker

        ## 2.14.2 — codename: slate-otter-12
        - faster cold start

        ## 2.14.0 — codename: coral-heron-40
        - first release of the 2.14 line
    score:
      expect_answer: '(codename\s*[:=]\s*)?amber-lantern-58'
      answer_shape: '(codename\s*[:=]\s*)?[a-z]+-[a-z]+-\d+'
    reference:
      answer: "VERSION says 2.14.3 is deployed, and CHANGELOG.md lists 2.14.3 with the codename amber-lantern-58.\n\nANSWER: amber-lantern-58"
      tools: [read_file, read_file]
      wrong_answers:
        - "ANSWER: marble-finch-91"  # the top entry: unreleased 2.15.0
        - "VERSION is 2.14.3, and the 2.14.3 entry's codename is amber-lantern-58.\n\nANSWER: slate-otter-12"  # right in prose, wrong answer line
        - "ANSWER: coral-heron-40"  # matched the 2.14 line, not the exact version
        - "ANSWER: 2.14.3"  # the version, not its codename
        - "The top entry of CHANGELOG.md is the newest release.\n\nThe answer is marble-finch-91."  # no answer line, but a bare codename of the right shape: the unreleased one
      right_answers:
        - "ANSWER: amber-lantern-58"
        - "VERSION contains 2.14.3. In CHANGELOG.md the top entry is 2.15.0 (unreleased, marble-finch-91), which is not deployed; below it, 2.14.3 has the codename amber-lantern-58 (2.14.2 is slate-otter-12 and 2.14.0 is coral-heron-40).\n\nANSWER: amber-lantern-58"
        - "**ANSWER:** `codename: amber-lantern-58`"
        - "Final answer: Amber-Lantern-58."
        - "amber-lantern-58"  # no answer line: the bare value is credited
        - "ANSWER: $\\boxed{\\text{amber-lantern-58}}$"  # LaTeX: \text{} inside \boxed{} inside $...$
        - "Version 2.14.3 is deployed; its codename is amber-lantern-58."  # no answer line, but the one codename in the prose is the right one: credited
      format_misses:
        - "ANSWER: amber-lantern-58 or marble-finch-91"  # hedged between deployed and unreleased: commits to neither
        - "Version 2.14.3 is deployed with codename amber-lantern-58; the unreleased 2.15.0 will be marble-finch-91."  # no answer line, two codenames in the prose
        - "CHANGELOG.md has codenames for 2.15.0, 2.14.3, 2.14.2 and 2.14.0; the deployed one is whichever matches VERSION."  # no answer line, no clear answer

  # -------------------------------------------------------------- medium ---

  - id: ms-grep-service-owner
    difficulty: medium
    notes: >
      medium — search → config → team file (three dependent reads); a substring
      grep for ledger-sync also hits the near-miss ledger-sync-archive in
      svc-02.conf, which leads to heron's PG-6618-HR.
    prompt: >
      One of the files in services/ configures the service called exactly
      ledger-sync. That file's contact line names a team file. What pager code
      is listed in that team file? End your reply with a final line
      `ANSWER: <the pager code>`.
    setup_files:
      services/svc-01.conf: "service = billing-api\ncontact = teams/osprey.md\nport = 7101\n"
      services/svc-02.conf: "service = ledger-sync-archive\ncontact = teams/heron.md\nport = 7102\n"
      services/svc-03.conf: "service = ledger-sync\ncontact = teams/kestrel.md\nport = 7103\n"
      services/svc-04.conf: "service = report-mailer\ncontact = teams/osprey.md\nport = 7104\n"
      teams/osprey.md: "# Osprey\npager: PG-2290-OS\nchannel: osprey-ops\n"
      teams/heron.md: "# Heron\npager: PG-6618-HR\nchannel: heron-ops\n"
      teams/kestrel.md: "# Kestrel\npager: PG-7351-KX\nchannel: kestrel-ops\n"
    score:
      expect_answer: '(pager( code)?\s*[:=]\s*)?PG-7351-KX'
      answer_shape: '(pager( code)?\s*[:=]\s*)?PG-\d{4}-[A-Z]{2}'
    reference:
      answer: "ledger-sync is configured in services/svc-03.conf, whose contact line points to teams/kestrel.md; that file lists the pager code PG-7351-KX.\n\nANSWER: PG-7351-KX"
      tools: [grep, read_file, read_file]
      wrong_answers:
        - "ANSWER: PG-6618-HR"  # the near-miss ledger-sync-archive → heron
        - "services/svc-03.conf configures ledger-sync and names teams/kestrel.md, whose pager is PG-7351-KX.\n\nANSWER: PG-2290-OS"  # right in prose, wrong answer line
        - "ANSWER: teams/kestrel.md"  # the team file, not its pager code
        - "ANSWER: kestrel-ops"  # the channel line, not the pager line
        - "PG-6618-HR"  # no answer line, but a bare pager code of the right shape: the near miss
      right_answers:
        - "ANSWER: PG-7351-KX"
        - "grep for ledger-sync matches two files: services/svc-02.conf, but that is ledger-sync-archive (teams/heron.md, pager PG-6618-HR), and services/svc-03.conf, which is exactly ledger-sync. Its contact is teams/kestrel.md, and that file lists pager: PG-7351-KX. (osprey's PG-2290-OS belongs to billing-api and report-mailer.)\n\nANSWER: PG-7351-KX"
        - "**ANSWER:** `pager: pg-7351-kx`"
        - "Final answer: PG-7351-KX."
        - "svc-03.conf → teams/kestrel.md.\n\nTherefore, PG-7351-KX."  # no answer line: the bare last line is credited
        - "ANSWER:\n```\nPG-7351-KX\n```"  # empty label, the value in a fenced block below it
        - "ledger-sync is in services/svc-03.conf → teams/kestrel.md; the pager code is PG-7351-KX."  # no answer line, but the one pager code in the prose is the right one: credited
      format_misses:
        - "ANSWER: PG-7351-KX or PG-6618-HR"  # hedged between the answer and the near miss: commits to neither
        - "ledger-sync points to teams/kestrel.md with pager PG-7351-KX, and ledger-sync-archive to teams/heron.md with pager PG-6618-HR."  # no answer line, two pager codes in the prose
        - "Both services/svc-02.conf and services/svc-03.conf mention ledger-sync, so the pager could be heron's or kestrel's."  # no answer line, no clear answer

  - id: ms-latest-log-first-error
    difficulty: medium
    notes: "medium — pick the newest dated log, then the FIRST error in it (a later error and an older log are distractors)."
    prompt: >
      logs/ holds one log per day, named app-YYYY-MM-DD.log. In the most
      recent day's log, find the FIRST line whose level is ERROR and write its
      request id (the value after req=) to {workspace}/first_error.txt.
    setup_files:
      logs/app-2026-02-28.log: |
        2026-02-28T09:00:00 INFO req=r-30011-a started
        2026-02-28T09:00:04 ERROR req=r-30017-c upstream closed
      logs/app-2026-03-05.log: |
        2026-03-05T08:12:00 INFO req=r-41020-d started
        2026-03-05T08:12:09 ERROR req=r-41026-k disk quota
      logs/app-2026-03-12.log: |
        2026-03-12T07:58:10 INFO req=r-58200-m started
        2026-03-12T07:58:31 WARN req=r-58207-t slow response (ERROR budget 12%)
        2026-03-12T07:59:02 INFO req=r-58209-p cache warm
        2026-03-12T08:01:45 ERROR req=r-58213-q token expired
        2026-03-12T08:02:10 INFO req=r-58220-s retry ok
        2026-03-12T08:05:55 ERROR req=r-58240-z write timeout
      logs/app-2026-03-09.log: |
        2026-03-09T10:00:00 INFO req=r-44100-f started
        2026-03-09T10:00:07 ERROR req=r-44102-b schema mismatch
    score:
      expect_file_regex: {path: first_error.txt, pattern: '\A\s*(req=)?r-58213-q\s*\Z'}
    reference:
      files: {first_error.txt: "r-58213-q\n"}
      tools: [glob, read_file, write_file]
      wrong_files:
        - {"first_error.txt": "r-58207-t\n"}  # WARN line with ERROR in its message
        - {"first_error.txt": "r-58240-z\n"}  # last error, not first

  - id: ms-semver-latest-codename
    difficulty: medium
    smoke: true
    notes: "medium — compare versions numerically (text order picks v1.9.3), then read that file."
    prompt: >
      releases/ has one notes file per version, named vMAJOR.MINOR.PATCH.txt.
      Find the HIGHEST version — compare the numbers numerically, not as text —
      and write the codename from its notes file to
      {workspace}/latest_codename.txt (just the codename).
    setup_files:
      releases/v1.2.11.txt: "codename: dusk-marten-15\nnotes: legacy line\n"
      releases/v1.9.3.txt: "codename: ember-wren-88\nnotes: last of the 1.9 line\n"
      releases/v1.9.12.txt: "codename: frost-plover-27\nnotes: backport build\n"
      releases/v1.10.0.txt: "codename: cobalt-ibis-7304\nnotes: new storage engine\n"
      releases/v1.1.40.txt: "codename: moss-grebe-63\nnotes: very old\n"
    score:
      expect_file_regex:
        path: latest_codename.txt
        pattern: '\A\s*(codename:\s*)?cobalt-ibis-7304\s*\Z'
    reference:
      files: {latest_codename.txt: "cobalt-ibis-7304\n"}
      tools: [glob, read_file, write_file]
      wrong_files:
        - {"latest_codename.txt": "ember-wren-88\n"}  # text-sorted v1.9.3
        - {"latest_codename.txt": "frost-plover-27\n"}  # v1.9.12

  - id: ms-template-render
    difficulty: medium
    notes: "medium — read a template and a vars file, substitute every placeholder (one repeats), write the exact result."
    prompt: >
      Render templates/notice.tmpl: replace each {{key}} placeholder with the
      value of that key from vars/notice.json, and write the result to
      {workspace}/out/notice.txt. Keep every other character of the template
      unchanged.
    setup_files:
      templates/notice.tmpl: "Maintenance for {{service}} starts at {{start}} and lasts {{minutes}} minutes.\nTicket: {{ticket}} ({{service}})\n"
      vars/notice.json: "{\"service\": \"quartz-relay\", \"start\": \"02:30 UTC\", \"minutes\": 45, \"ticket\": \"CHG-60417\", \"owner\": \"team-lapwing\"}\n"
    score:
      expect_file_regex:
        path: out/notice.txt
        pattern: '\A\s*Maintenance for quartz-relay starts at 02:30 UTC and lasts 45 minutes\.[ \t]*\r?\nTicket: CHG-60417 \(quartz-relay\)\s*\Z'
    reference:
      files: {out/notice.txt: "Maintenance for quartz-relay starts at 02:30 UTC and lasts 45 minutes.\nTicket: CHG-60417 (quartz-relay)\n"}
      tools: [read_file, read_file, write_file]
      wrong_files:
        - {"out/notice.txt": "Maintenance for quartz-relay starts at 02:30 UTC and lasts 45 minutes.\nTicket: CHG-60417 ({{service}})\n"}  # replaced only the first {{service}}
        - {"out/notice.txt": "Maintenance for {{service}} starts at {{start}} and lasts {{minutes}} minutes.\nTicket: {{ticket}} ({{service}})\n"}  # template copied unrendered

  - id: ms-run-script-low-stock
    difficulty: medium
    notes: "medium — run a script, filter its output (< 10, the 10 is a boundary), sort, write."
    prompt: >
      Run `sh tools/stock_report.sh` in the working directory. It prints one
      line per SKU: the SKU and its quantity on hand. Write the SKUs whose
      quantity is below 10 to {workspace}/reorder.txt, one per line, sorted
      alphabetically, and nothing else.
    setup_files:
      tools/stock_report.sh: |
        #!/bin/sh
        # on hand = received - shipped - damaged
        line() { echo "$1 $(( $2 - $3 - $4 ))"; }
        line SKU-TEAL-118 140 131 2
        line SKU-ONYX-402 75 22 0
        line SKU-AMBER-077 64 51 3
        line SKU-CORAL-913 90 85 2
        line SKU-JADE-250 30 17 1
        line SKU-PLUM-664 48 46 2
        line SKU-SAGE-481 55 14 0
        line SKU-RUST-339 120 108 3
    score:
      expect_file_regex:
        path: reorder.txt
        pattern: '\A\s*SKU-CORAL-913[ \t]*\r?\nSKU-PLUM-664[ \t]*\r?\nSKU-RUST-339[ \t]*\r?\nSKU-TEAL-118\s*\Z'
    reference:
      files: {reorder.txt: "SKU-CORAL-913\nSKU-PLUM-664\nSKU-RUST-339\nSKU-TEAL-118\n"}
      tools: [bash, write_file]
      wrong_files:
        - {"reorder.txt": "SKU-AMBER-077\nSKU-CORAL-913\nSKU-PLUM-664\nSKU-RUST-339\nSKU-TEAL-118\n"}  # included the boundary qty 10
        - {"reorder.txt": "SKU-TEAL-118\nSKU-CORAL-913\nSKU-PLUM-664\nSKU-RUST-339\n"}  # script order, not sorted

  - id: ms-config-chain-3hop
    difficulty: medium
    notes: >
      medium — three dependent reads (deploy → env → secrets); the prod chain
      (cinder-coast-17) is the distractor, baited by current.toml's "switched
      from prod" comment and by a grep that finds both region lines.
    prompt: >
      deploy/current.toml says which environment file is active. Follow it:
      the environment file names a secrets file, and that secrets file has a
      region line. Which region is it? End your reply with a final line
      `ANSWER: <the region>`.
    setup_files:
      deploy/current.toml: "# switched from prod on 2026-03-01\nenv_file = \"envs/canary.json\"\n"
      envs/prod.json: "{\"name\": \"prod\", \"secrets_ref\": \"vault/prod-keys.txt\", \"replicas\": 6}\n"
      envs/canary.json: "{\"name\": \"canary\", \"secrets_ref\": \"vault/canary-keys.txt\", \"replicas\": 2}\n"
      vault/prod-keys.txt: "key_id=kp-1182\nregion=cinder-coast-17\n"
      vault/canary-keys.txt: "key_id=kc-5530\nregion=aurora-basin-42\n"
    score:
      expect_answer: '(region\s*[:=]\s*)?aurora-basin-42'
      answer_shape: '(region\s*[:=]\s*)?[a-z]+-[a-z]+-\d+'
    reference:
      answer: "deploy/current.toml → envs/canary.json → vault/canary-keys.txt, whose region line is region=aurora-basin-42.\n\nANSWER: aurora-basin-42"
      tools: [read_file, read_file, read_file]
      wrong_answers:
        - "ANSWER: cinder-coast-17"  # the prod chain
        - "current.toml points to envs/canary.json, whose secrets file vault/canary-keys.txt has region=aurora-basin-42.\n\nANSWER: cinder-coast-17"  # right in prose, wrong answer line
        - "ANSWER: canary"  # the environment, not the region
        - "ANSWER: kc-5530"  # the key_id line, not the region line
        - "region=cinder-coast-17"  # no answer line, but a bare region of the right shape: the prod chain
      right_answers:
        - "ANSWER: aurora-basin-42"
        - "deploy/current.toml has a comment saying it was switched from prod, but its env_file is envs/canary.json. That names vault/canary-keys.txt as its secrets file (prod's would be vault/prod-keys.txt with region=cinder-coast-17), and vault/canary-keys.txt has region=aurora-basin-42.\n\nANSWER: aurora-basin-42"
        - "**ANSWER:** `region=aurora-basin-42`"
        - "Final answer: Aurora-Basin-42"
        - "current.toml → envs/canary.json → vault/canary-keys.txt.\n\nThe final answer is aurora-basin-42."  # no answer line: the bare last line is credited
        - "ANSWER: region=aurora‐basin‐42"  # unicode hyphens
        - "current.toml → envs/canary.json → vault/canary-keys.txt: the region is aurora-basin-42."  # no answer line, but the one region in the prose is the right one: credited
      format_misses:
        - "ANSWER: region=aurora‐basin‐42 (from vault/canary-keys.txt)"  # a parenthetical on the line may qualify the value: unreadable, never credited
        - "ANSWER: aurora-basin-42 or cinder-coast-17"  # hedged between both chains: commits to neither
        - "The canary chain ends at region aurora-basin-42 and the prod chain at region cinder-coast-17."  # no answer line, two regions in the prose
        - "current.toml was switched from prod, so the region is whatever the canary secrets file says."  # no answer line, no clear answer

