  - id: ms-manifest-rename
    difficulty: hard
    notes: "hard — move files per a manifest (one name has spaces and parentheses), leave unlisted files alone; hidden test checks every path."
    prompt: >
      renames.csv lists files in incoming/ (column old) and the path each one
      must be moved to (column new). Both columns are relative to
      {workspace}. Move every listed file to its new path, creating folders as
      needed. Files that are not listed stay where they are, and no file's
      contents may change.
    setup_files:
      renames.csv: |
        old,new
        incoming/scan_0041.txt,archive/2026/invoice-8841.txt
        incoming/scan_0042.txt,archive/2026/receipt-8842.txt
        incoming/IMG_7719.txt,photos/site-visit-7719.txt
        incoming/untitled (3).txt,notes/call-summary-0312.txt
      incoming/scan_0041.txt: "invoice 8841 for 1,240.00 due 2026-04-01\n"
      incoming/scan_0042.txt: "receipt 8842 paid 312.50\n"
      incoming/scan_0043.txt: "draft 8843 not final\n"
      incoming/IMG_7719.txt: "photo placeholder: north wall, visit 7719\n"
      incoming/untitled (3).txt: "call summary: agreed on the wren-7 rollout for 03-12\n"
      incoming/keep-me.txt: "leave this file here\n"
    acceptance: "{unittest} hidden_test_ms_renames"
    acceptance_files:
      hidden_test_ms_renames.py: |
        import unittest
        from pathlib import Path

        MOVES = {
            "incoming/scan_0041.txt": ("archive/2026/invoice-8841.txt",
                                       "invoice 8841 for 1,240.00 due 2026-04-01"),
            "incoming/scan_0042.txt": ("archive/2026/receipt-8842.txt",
                                       "receipt 8842 paid 312.50"),
            "incoming/IMG_7719.txt": ("photos/site-visit-7719.txt",
                                      "photo placeholder: north wall, visit 7719"),
            "incoming/untitled (3).txt": ("notes/call-summary-0312.txt",
                                          "call summary: agreed on the wren-7 rollout for 03-12"),
        }
        STAY = {
            "incoming/scan_0043.txt": "draft 8843 not final",
            "incoming/keep-me.txt": "leave this file here",
        }


        class TestRenames(unittest.TestCase):
            def test_listed_files_moved_intact(self):
                for old, (new, body) in MOVES.items():
                    self.assertFalse(Path(old).exists(), f"{old} still exists")
                    self.assertTrue(Path(new).is_file(), f"{new} missing")
                    self.assertEqual(Path(new).read_text().strip(), body, new)

            def test_unlisted_files_stay(self):
                for path, body in STAY.items():
                    self.assertTrue(Path(path).is_file(), f"{path} was moved or deleted")
                    self.assertEqual(Path(path).read_text().strip(), body, path)


        if __name__ == "__main__":
            unittest.main()
    reference:
      files:
        archive/2026/invoice-8841.txt: "invoice 8841 for 1,240.00 due 2026-04-01\n"
        archive/2026/receipt-8842.txt: "receipt 8842 paid 312.50\n"
        photos/site-visit-7719.txt: "photo placeholder: north wall, visit 7719\n"
        notes/call-summary-0312.txt: "call summary: agreed on the wren-7 rollout for 03-12\n"
      delete_files:
        - incoming/scan_0041.txt
        - incoming/scan_0042.txt
        - incoming/IMG_7719.txt
        - incoming/untitled (3).txt
      tools: [read_file, bash]
      wrong_files:
        - {"incoming/untitled (3).txt": "call summary: agreed on the wren-7 rollout for 03-12\n"}  # copied, not moved (the name with spaces)
        - {"photos/site-visit-7719.txt": "photo placeholder: north wall, visit 7719 (moved)\n"}  # contents changed in transit

