# Class: single tool call — one call is enough. Every answer is planted in the
# workspace and unguessable, so a correct answer implies the tool was used;
# the check is on the answer, not on which tool got it.
class: single_tool
tasks:
  - id: st-read-config-port
    difficulty: easy
    smoke: true
    prompt: "What port is configured in settings.ini? End your reply with a final line `ANSWER: <the port number>`."
    setup_files:
      settings.ini: |
        [server]
        host = 0.0.0.0
        port = 48217
        workers = 4
    score:
      expect_answer: '(?:port\s*[:=]?\s*)?48217'
      answer_shape: '(?:port\s*[:=]?\s*)?\d+'
    reference:
      answer: "settings.ini sets `port = 48217` in its [server] section.\n\nANSWER: 48217"
      tools: [read_file]
      wrong_answers:
        - "ANSWER: 4"  # the worker count
        - "ANSWER: 0.0.0.0"  # the host
        - "The [server] section sets port = 48217 with 4 workers.\n\nANSWER: 4"  # right value in prose, the worker count committed
        - "ANSWER: 48127"  # digits transposed
        - "ANSWER: 8080"  # a default port, not the file's
        - "48127"  # bare, no answer line: a wrong value of the right shape, digits transposed
      right_answers:
        - "ANSWER: 48217"
        - "settings.ini has host = 0.0.0.0, port = 48217 and workers = 4; the host and the worker count are not ports.\n\nANSWER: 48217"  # walks the file, naming the other values
        - "**ANSWER:** `48217`"
        - "Final answer: port = 48217"
        - "So the answer is 48217."  # bare value behind a lead-in, no answer line: credited
        - "ANSWER: <48217>"  # the prompt's placeholder brackets copied
        - "The configured port is 48217."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "I opened settings.ini and read its [server] section: the host, the port and the worker count are all set there."  # prose with no clear answer, no answer line
    notes: "Reads one value from a small INI file. No look-alike port is planted: the other values are a host (0.0.0.0) and a worker count (4)."

  # --- easy -------------------------------------------------------------

  - id: st-read-manifest-build-tag
    difficulty: easy
    prompt: "What is the build_tag in manifest.json? End your reply with a final line `ANSWER: <the build_tag value>`."
    setup_files:
      manifest.json: |
        {
          "name": "tern-console",
          "version": "4.12.0",
          "release_channel": "heron-prod",
          "build_tag": "heron-staging-3318",
          "commit": "9c41e07"
        }
    score:
      expect_answer: '(?:build_tag\s*[:=]\s*)?heron-staging-3318'
      answer_shape: '(?:build_tag\s*[:=]\s*)?[a-z]+-[a-z]+-\d+'
    reference:
      answer: "manifest.json has \"build_tag\": \"heron-staging-3318\". (The release_channel, heron-prod, is a different field.)\n\nANSWER: heron-staging-3318"
      tools: [read_file]
      wrong_answers:
        - "ANSWER: heron-prod"  # the release_channel
        - "The build_tag field says heron-staging-3318, but the channel it ships on is heron-prod.\n\nANSWER: heron-prod"  # right value in prose, the release_channel committed
        - "ANSWER: heron-staging-3381"  # digits transposed
        - "ANSWER: 9c41e07"  # the commit
        - "ANSWER: 4.12.0"  # the version
        - "heron-staging-3381"  # bare, no answer line: digits transposed, a wrong value of the build-tag kind
      right_answers:
        - "ANSWER: heron-staging-3318"
        - "manifest.json lists name tern-console, version 4.12.0, release_channel heron-prod, build_tag heron-staging-3318 and commit 9c41e07. The field asked for is build_tag, not the release_channel.\n\nANSWER: heron-staging-3318"  # walks the file in order, look-alike first
        - "**ANSWER:** `heron-staging-3318`"
        - "Final answer: build_tag = heron-staging-3318"
        - "manifest.json, build_tag field:\n\nheron-staging-3318"  # bare value on the last line, no answer line: credited
        - "ANSWER: heron\u2011staging\u20113318"  # non-breaking hyphens (U+2011)
        - "The build_tag is heron-staging-3318."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "manifest.json has a build_tag field two lines below the release_channel, and the two values look alike."  # prose with no clear answer, no answer line
        - "heron-prod"  # bare, no answer line: the release_channel is not a value of the build-tag kind, so it is not read as an answer
    notes: "Reads one JSON field. release_channel heron-prod is the look-alike value two lines above build_tag."

  - id: st-log-error-code
    difficulty: easy
    prompt: "logs/app.log has exactly one ERROR line. What error code does it report? End your reply with a final line `ANSWER: <the error code>`."
    setup_files:
      logs/app.log: |
        2026-03-02T08:14:01Z INFO  boot complete in 412ms
        2026-03-02T08:14:07Z WARN  cache warmup slow code=W-1187-LM
        2026-03-02T08:15:22Z INFO  worker pool size=6
        2026-03-02T08:16:40Z ERROR ledger sync failed code=E-5520-QX
        2026-03-02T08:16:41Z INFO  retry scheduled in 30s
    score:
      expect_answer: '(?:code\s*[:=]\s*)?E-5520-QX'
      answer_shape: '(?:code\s*[:=]\s*)?[A-Z]+-\d+(?:-[A-Z]+)?'
    reference:
      answer: "The ERROR line is `2026-03-02T08:16:40Z ERROR ledger sync failed code=E-5520-QX`.\n\nANSWER: E-5520-QX"
      tools: [read_file]
      wrong_answers:
        - "ANSWER: W-1187-LM"  # the WARN line's code
        - "The ERROR line reports E-5520-QX; the first code in the log is W-1187-LM.\n\nANSWER: W-1187-LM"  # right value in prose, the WARN code committed
        - "ANSWER: E-5502-QX"  # digits transposed
        - "ANSWER: E-5520"  # truncated code
        - "W-1187-LM"  # bare, no answer line: the WARN line's code
      right_answers:
        - "ANSWER: E-5520-QX"
        - "Two lines carry a code: the WARN line at 08:14:07 (cache warmup slow) has code=W-1187-LM, and the ERROR line at 08:16:40 (ledger sync failed) has code=E-5520-QX. Only the second is the ERROR.\n\nANSWER: E-5520-QX"  # walks the file in order, the WARN code first
        - "**ANSWER:** code=E-5520-QX"
        - "Final answer: `E-5520-QX`"
        - "The only ERROR line is at 08:16:40.\n\nE-5520-QX"  # bare value on the last line, no answer line: credited
        - "ANSWER:\nE-5520-QX"  # the value on the line below the label
        - "The ERROR line reports code E-5520-QX."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "The ERROR line is the ledger sync failure at 08:16:40, and it carries a code at its end."  # prose with no clear answer, no answer line
    notes: "Picks the code off the only ERROR line. The WARN line's W-1187-LM is the look-alike and comes first in the file."

  - id: st-run-token-script
    difficulty: easy
    prompt: "Run `python3 tools/make_token.py` and tell me the token it prints. End your reply with a final line `ANSWER: <the token>`."
    setup_files:
      tools/make_token.py: |
        import hashlib

        seed = "ladder-kestrel-" + str(sum(range(1, 58)))
        print("token:", hashlib.sha256(seed.encode()).hexdigest()[:12])
    score:
      expect_answer: '(?:token\s*[:=]?\s*)?d3df6407739f'
      answer_shape: '(?:token\s*[:=]?\s*)?[0-9a-f]{8,}'
    reference:
      answer: "The script prints:\n\n```\ntoken: d3df6407739f\n```\n\nANSWER: d3df6407739f"
      tools: [bash]
      wrong_answers:
        - "ANSWER: c200ca6f2b3c"  # seed worked by hand with range(1, 57)
        - "The script printed token: d3df6407739f, from the seed below.\n\nANSWER: ladder-kestrel-1653"  # right value in prose, the seed committed
        - "ANSWER: 40a41b29b8a2"  # seed worked by hand with range(1, 59)
        - "ANSWER: d3df6407739"  # truncated to 11 characters
        - "c200ca6f2b3c"  # bare, no answer line: the seed worked by hand with range(1, 57)
      right_answers:
        - "ANSWER: d3df6407739f"
        - "The seed is \"ladder-kestrel-\" + str(sum(range(1, 58))) = ladder-kestrel-1653 (range stops at 57, so not 1711), and the script prints the first 12 hex digits of its sha256: token: d3df6407739f.\n\nANSWER: d3df6407739f"  # shows the derivation, naming the seed
        - "**ANSWER:** `token: d3df6407739f`"
        - "Final answer: d3df6407739f"
        - "The script prints token: d3df6407739f.\n\nThe answer is d3df6407739f."  # bare value behind a lead-in, no answer line: credited
        - "ANSWER: token = d3df6407739f"  # labelled with =
        - "The script prints token: d3df6407739f"  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "I ran tools/make_token.py, and it printed a 12-character token derived from the seed."  # prose with no clear answer, no answer line
        - "ANSWER: d3df6407739f (printed by the script)"  # a trailing note in parentheses: a parenthetical may qualify or hedge the value, so the line is not read
    notes: "The token can only be had by running the script. The wrong tokens are seeds worked by hand off by one either way (range(1, 57) gives c200ca6f2b3c, range(1, 59) gives 40a41b29b8a2)."

  - id: st-write-greeting-file
    difficulty: easy
    prompt: "Create the file {workspace}/greeting.txt containing exactly one line: Hello from ladder-9142"
    score:
      expect_file_regex: {path: greeting.txt, pattern: '\AHello from ladder-9142\n?\Z'}
    reference:
      answer: "Created greeting.txt."
      files:
        greeting.txt: |
          Hello from ladder-9142
      tools: [write_file]
      wrong_files:
        - {greeting.txt: "Hello from ladder-9142 \n"}
        - {greeting.txt: "hello from ladder-9142\n"}
        - {greeting.txt: "\"Hello from ladder-9142\"\n"}
        - {greeting.txt: "Hello from ladder-9142\n\n"}  # trailing blank line
        - {greeting.txt: "Hello from ladder-9142.\n"}  # added a full stop
    notes: "File-checked: the regex is anchored at both ends, so extra text fails."

  - id: st-grep-unique-constant
    difficulty: easy
    prompt: "Which file under src/ defines the constant MAX_RETRY_BUDGET_QZ? End your reply with a final line `ANSWER: <the file path>`."
    setup_files:
      src/app.py: |
        from net.client import fetch


        def main():
            print(fetch("/status"))
      src/core/limits.py: |
        MAX_RETRY_BUDGET = 5
        MAX_PAYLOAD_KB = 512
      src/net/backoff.py: |
        import random

        MAX_RETRY_BUDGET_QZ = 11


        def delay(attempt):
            return min(30, 2 ** attempt) + random.random()
      src/net/client.py: |
        from net.backoff import delay


        def fetch(path):
            return {"path": path, "delay": delay(1)}
      src/util/text.py: |
        def slug(s):
            return s.strip().lower().replace(" ", "-")
    score:
      expect_answer: '(?:(?:\./|/\S*/)?src/)?net/backoff\.py(?::\d+)?'
      answer_shape: '[\w./-]+\.py(?::\d+)?'
    reference:
      answer: "`MAX_RETRY_BUDGET_QZ = 11` is on line 3 of src/net/backoff.py.\n\nANSWER: src/net/backoff.py"
      tools: [grep]
      wrong_answers:
        - "ANSWER: src/core/limits.py"  # the near-miss MAX_RETRY_BUDGET
        - "MAX_RETRY_BUDGET_QZ = 11 is in src/net/backoff.py; the budget itself lives in limits.py.\n\nANSWER: src/core/limits.py"  # right value in prose, the near-miss committed
        - "ANSWER: src/net/client.py"  # the module that imports from backoff.py
        - "src/core/limits.py"  # bare, no answer line: the near-miss MAX_RETRY_BUDGET
      right_answers:
        - "ANSWER: src/net/backoff.py"
        - "A grep for MAX_RETRY_BUDGET hits two files: src/core/limits.py (MAX_RETRY_BUDGET = 5) and src/net/backoff.py (MAX_RETRY_BUDGET_QZ = 11). Only the second defines the _QZ constant; src/net/client.py just imports delay from it.\n\nANSWER: src/net/backoff.py"  # names the near-miss and the importer first
        - "**ANSWER:** `./src/net/backoff.py`"
        - "Final answer: /tmp/prometheus-ladder/ws/src/net/backoff.py"
        - "ANSWER: net/backoff.py"  # relative to src/, as the question is
        - "grep finds the _QZ constant in one file:\n\nsrc/net/backoff.py"  # bare path on the last line, no answer line: credited
        - "**ANSWER:**\n\n`src/net/backoff.py`"  # the value on the line below the label
        - "It is defined in src/net/backoff.py."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
        - "ANSWER: src/net/backoff.py:3"  # grep's path:line form
      format_misses:
        - "The constant is defined in the networking package, next to the delay() helper."  # prose with no clear answer, no answer line
        - "ANSWER: src/core/limits.py, src/net/backoff.py"  # both prefix-grep hits: two candidate files and no pick, so nothing is committed
        - "ANSWER: src/net/backoff.py or src/core/limits.py"  # hedged between two files: commits to neither
    notes: "Finds the one file that defines MAX_RETRY_BUDGET_QZ. A grep of the prefix MAX_RETRY_BUDGET also hits src/core/limits.py."

  - id: st-read-meeting-owner
    difficulty: easy
    prompt: "In notes/meeting-2026-02-11.md, who owns the invoice export action item? End your reply with a final line `ANSWER: <the person's name>`."
    setup_files:
      notes/meeting-2026-02-11.md: |
        # Platform sync, 11 Feb

        Attendees: Odalys Brennwick, Tobiah Qarsen, Mirela Vasquine

        ## Action items

        - [ ] Cache eviction review: owner **Tobiah Qarsen**, due 2026-02-24
        - [ ] Invoice export: owner **Odalys Brennwick**, due 2026-02-20
        - [x] Rotate staging keys: owner **Mirela Vasquine**
    score:
      expect_answer: '(?:Odalys\s+)?Brennwick'
      answer_shape: '(?:(?:odalys|tobiah|mirela)\s+)?(?:brennwick|qarsen|vasquine)|(?!(?:thank|best|kind|warm|good|many|hope|happy|see)\s)(?-i:[A-Z][a-z]+\s+[A-Z][a-z]+)'
    reference:
      answer: "The action item reads \"Invoice export: owner **Odalys Brennwick**, due 2026-02-20\".\n\nANSWER: Odalys Brennwick"
      tools: [read_file]
      wrong_answers:
        - "ANSWER: Tobiah Qarsen"  # the neighbouring item's owner
        - "Odalys Brennwick owns the invoice export; Tobiah Qarsen owns the item above it.\n\nANSWER: Tobiah Qarsen"  # right value in prose, the neighbour committed
        - "ANSWER: Mirela Vasquine"  # the staging keys owner
        - "Tobiah Qarsen"  # bare, no answer line: the neighbouring item's owner
      right_answers:
        - "ANSWER: Odalys Brennwick"
        - "All three attendees own an item: Tobiah Qarsen the cache eviction review, Odalys Brennwick the invoice export (due 2026-02-20), and Mirela Vasquine the staging key rotation.\n\nANSWER: Odalys Brennwick"  # names every owner, the neighbour first
        - "**ANSWER:** *Brennwick*"
        - "Final answer: odalys brennwick"
        - "The invoice export item names its owner in bold.\n\nOdalys Brennwick"  # bare name on the last line, no answer line: credited
        - "Final Answer: $\\text{Odalys Brennwick}$"  # LaTeX \text{}
        - "Odalys Brennwick owns the invoice export item."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "The invoice export action item has an owner in bold and is due on 2026-02-20."  # prose with no clear answer, no answer line
        - "ANSWER: Odalys Brennwick, Tobiah Qarsen, Mirela Vasquine"  # the attendee line: three candidate names and no pick, so nothing is committed
        - "ANSWER: Odalys Brennwick or Tobiah Qarsen"  # hedged between adjacent items: commits to neither
    notes: "Reads the owner of one action item. The attendee line lists all three names, and the neighbouring items belong to the other two."

  - id: st-run-shell-build-id
    difficulty: easy
    prompt: "Run `sh build_id.sh` and report the build id it prints. End your reply with a final line `ANSWER: <the build id>`."
    setup_files:
      build_id.sh: |
        #!/bin/sh
        part1=$(printf '%s' "tern" | tr 'a-z' 'n-za-m')
        part2=$((6173 * 7))
        echo "build-id: ${part1}-${part2}"
    score:
      expect_answer: '(?:build-id\s*[:=]\s*)?grea-43211'
      answer_shape: '(?:build-id\s*[:=]\s*)?[a-z]+-\d+'
    reference:
      answer: "The script prints `build-id: grea-43211`.\n\nANSWER: grea-43211"
      tools: [bash]
      wrong_answers:
        - "ANSWER: tern-43211"  # the unrun input
        - "The script prints build-id: grea-43211, built from the name tern.\n\nANSWER: tern-43211"  # right value in prose, the input committed
        - "ANSWER: gren-43211"  # rot13 worked by hand, n mapped wrong
        - "ANSWER: grea-42211"  # 6173 * 7 worked by hand, wrong
        - "ANSWER: grea-6173"  # the multiplication left out
        - "tern-43211"  # bare, no answer line: the unrun input
      right_answers:
        - "ANSWER: grea-43211"
        - "part1 is \"tern\" through rot13 (tr 'a-z' 'n-za-m'), which gives \"grea\" (tern is only the input), and part2 is 6173 * 7 = 43211. The script prints build-id: grea-43211.\n\nANSWER: grea-43211"  # shows the derivation, naming the input
        - "**ANSWER:** `build-id: grea-43211`"
        - "Final answer: grea-43211"
        - "So grea-43211."  # bare value behind a lead-in, no answer line: credited
        - "ANSWER: grea\u201043211"  # a Unicode hyphen (U+2010)
        - "The build id is grea-43211."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "The script runs rot13 over a name and multiplies two numbers to build the id."  # prose with no clear answer, no answer line
    notes: "The id can only be had by running the script (rot13 plus arithmetic). tern is the script's input, so tern-43211 is the unrun answer."

  # --- medium -----------------------------------------------------------

  - id: st-glob-count-csv
    difficulty: medium
    prompt: "How many files with the .csv extension are there under reports/, including all of its subfolders? End your reply with a final line `ANSWER: <the number>`."
    setup_files:
      reports/README.md: |
        Monthly and regional exports.
      reports/2025/q3.csv: |
        region,total
        north,120
      reports/2025/q4.csv: |
        region,total
        north,131
      reports/2025/notes.txt: |
        q4 restated
      reports/2026/jan.csv: |
        region,total
        north,44
      reports/2026/feb.csv: |
        region,total
        north,47
      reports/2026/feb.csv.bak: |
        region,total
        north,46
      reports/2026/mar.csv: |
        region,total
        north,52
      reports/2026/archive/old_jan.csv: |
        region,total
        north,40
      reports/regional/north.csv: |
        month,total
        jan,44
      reports/regional/north.tsv: |
        month	total
        jan	44
      data/extra.csv: |
        a,b
        1,2
    score:
      expect_answer: '(?:7|seven)(?:\s+(?:\.?csv\s+)?files)?'
      answer_shape: '(?:\d+|zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)(?:\s+(?:\.?csv\s+)?files)?'
    reference:
      answer: "Globbing reports/**/*.csv matches:\n\n1. reports/2025/q3.csv\n2. reports/2025/q4.csv\n3. reports/2026/jan.csv\n4. reports/2026/feb.csv\n5. reports/2026/mar.csv\n6. reports/2026/archive/old_jan.csv\n7. reports/regional/north.csv\n\nANSWER: 7"
      tools: [glob]
      wrong_answers:
        - "ANSWER: 8"  # counted feb.csv.bak
        - "The glob finds 7 .csv files; with feb.csv.bak there are 8.\n\nANSWER: 8"  # right value in prose, the .bak counted in the answer
        - "ANSWER: 6"  # skipped archive/
        - "ANSWER: 9"  # counted feb.csv.bak and data/extra.csv
        - "1. reports/2025/q3.csv\n2. reports/2025/q4.csv\n3. reports/2026/jan.csv\n4. reports/2026/feb.csv\n5. reports/2026/feb.csv.bak\n6. reports/2026/mar.csv\n7. reports/2026/archive/old_jan.csv\n8. reports/regional/north.csv\n\nANSWER: 8"  # an over-long list whose item 7. is not the answer
        - "8"  # bare, no answer line: counted feb.csv.bak
      right_answers:
        - "ANSWER: 7"
        - "The .csv files under reports/ are q3.csv and q4.csv in 2025/, jan.csv, feb.csv and mar.csv in 2026/, archive/old_jan.csv and regional/north.csv. feb.csv.bak ends in .bak and north.tsv in .tsv, and data/extra.csv is outside reports/; counting the .bak would give 8, and both 9.\n\nANSWER: 7"  # walks the matches and names the distractor counts
        - "**ANSWER:** 7 .csv files"
        - "Final answer: seven"
        - "The recursive glob matches q3, q4, jan, feb, mar, old_jan and north.\n\n7"  # bare count on the last line, no answer line: credited
        - "Final Answer: $\\boxed{7}$"  # LaTeX \boxed{}
        - "There are 7 .csv files under reports/."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "The glob matches .csv files in 2025/, 2026/, 2026/archive/ and regional/ under reports/."  # prose with no clear answer, no answer line
    notes: "Counts .csv files recursively under reports/. feb.csv.bak and data/extra.csv (outside reports/) are the distractors, giving 8 or 9."

