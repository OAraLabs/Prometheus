  - id: st-run-report-net
    difficulty: medium
    prompt: "Run `python3 report.py --region north` and tell me the net figure it prints. End your reply with a final line `ANSWER: <the net figure>`."
    setup_files:
      report.py: |
        import sys

        # Amounts in cents.
        DATA = {
            "north": {"gross": 1844210, "refunds": 120755},
            "south": {"gross": 1618934, "refunds": 98410},
            "east": {"gross": 2071102, "refunds": 143388},
        }
        TAX_RATE = {"north": 0.1265, "south": 0.1180, "east": 0.1340}


        def fmt(cents):
            return f"{cents / 100:,.2f}"


        def report(region):
            d = DATA[region]
            base = d["gross"] - d["refunds"]
            tax = round(base * TAX_RATE[region])
            net = base - tax
            print(f"region: {region}")
            print(f"gross: {fmt(d['gross'])}")
            print(f"refunds: {fmt(d['refunds'])}")
            print(f"tax: {fmt(tax)}")
            print(f"net: {fmt(net)}")


        args = sys.argv[1:]
        if len(args) == 2 and args[0] == "--region" and args[1] in DATA:
            report(args[1])
        else:
            print("usage: report.py --region {north|south|east}")
            sys.exit(2)
    score:
      expect_answer: '(?:net\s*[:=]\s*)?\$?15[,\s]?054\.38'
      answer_shape: '(?:net\s*[:=]\s*)?\$?\d+(?:[,\s]\d{3})*(?:\.\d+)?'
    reference:
      answer: "The script prints:\n\n```\nregion: north\ngross: 18,442.10\nrefunds: 1,207.55\ntax: 2,180.17\nnet: 15,054.38\n```\n\nANSWER: 15,054.38"
      tools: [bash]
      wrong_answers:
        - "ANSWER: 18,442.10"  # the gross
        - "The last line says net: 15,054.38; before tax it is 17,234.55.\n\nANSWER: 17,234.55"  # right value in prose, gross minus refunds committed
        - "ANSWER: 2,180.17"  # the tax line
        - "ANSWER: 15,504.38"  # digits transposed
        - "ANSWER: 13,411.02"  # south's net
        - "17,234.55"  # bare, no answer line: gross minus refunds, the tax left out
      right_answers:
        - "ANSWER: 15,054.38"
        - "gross 18,442.10 minus refunds 1,207.55 is 17,234.55; minus tax 2,180.17 that leaves net 15,054.38, the script's last line.\n\nANSWER: 15,054.38"  # shows the derivation through the other figures
        - "**ANSWER:** $15054.38"
        - "Final answer: net: 15,054.38"
        - "ANSWER: 15\u202f054.38"  # narrow NBSP thousands separator
        - "Therefore, 15,054.38."  # bare value behind a lead-in, no answer line: credited
        - "ANSWER: net = 15,054.38"  # labelled with =
        - "ANSWER: $15{,}054.38$"  # LaTeX thousands separator
        - "The net figure for north is 15,054.38."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "report.py prints region, gross, refunds, tax and net for the north region."  # prose with no clear answer, no answer line
    notes: "The script prints five labelled figures and only the net line answers. Gross minus refunds (17,234.55) is the tax-less slip."

