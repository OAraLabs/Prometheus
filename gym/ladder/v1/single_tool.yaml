    score:
      expect_answer: '46(?:\s+(?:WARN(?:[-\s]level)?\s+)?lines)?'
      answer_shape: '\d+(?:\s+(?:WARN(?:[-\s]level)?\s+)?lines)?'
    reference:
      answer: "`awk '$2 == \"WARN\"' logs/worker.log | wc -l` gives 46.\n\nANSWER: 46"
      tools: [bash]
      wrong_answers:
        - "ANSWER: 49"  # the substring count
        - "Counting the level field gives 46; grep -c WARN gives 49.\n\nANSWER: 49"  # right value in prose, the substring count committed
        - "ANSWER: 45"  # off by one
        - "ANSWER: 47"  # off by one
        - "ANSWER: 3"  # only the INFO lines that mention WARN
        - "ANSWER: 300"  # every line
        - "49"  # bare, no answer line: the substring count
      right_answers:
        - "ANSWER: 46"
        - "grep -c WARN gives 49, but three of those are INFO lines that mention WARN in the message (\"suppressed 6 duplicate WARN lines\" and two more); counting the second field gives 46.\n\nANSWER: 46"  # explains the substring trap first
        - "**ANSWER:** 46 lines"
        - "Final answer: 46"
        - "Counting the second field, not the substring:\n\n46"  # bare value on the last line, no answer line: credited
        - "ANSWER: 46 WARN level lines"  # the level named, without a hyphen
        - "46 lines have level WARN."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "grep -c WARN over-counts, because three INFO lines mention WARN in their message."  # prose with no clear answer, no answer line
        - "ANSWER: 46 (the level field; grep -c WARN gives 49)"  # a trailing note in parentheses: a parenthetical may qualify or hedge the value, so the line is not read (it also names 49)
    notes: "300-line log. Three INFO lines mention WARN in their message, so a substring count gives 49 while the level field gives 46."

  - id: st-csv-region-quarter
    difficulty: hard
    prompt: "In revenue.csv, what was the q3 revenue of the region named exactly \"Lowmarsh\"? End your reply with a final line `ANSWER: <the number>`."
    setup_files:
      revenue.csv: |
        region,q1,q2,q3,q4
        Northgate,41022,43518,45907,47110
        Brackwater,29870,30114,31552,32008
        Lowmarsh East,38210,39004,40117,40999
        Highfen,51233,50871,52460,53915
        Coldharbour Rise,22015,23380,24122,25707
        Ashvale,33470,34018,35561,36275
        Lowmarsh,44380,46215,48117,49302
        Lowmarsh West,36551,37230,38904,39418
        Pennick Downs,27714,28090,29305,30871
        Saltmere,45902,47368,48711,50024
        Thornby,19887,20412,21135,22760
        Quillon Heath,31104,32577,33019,34480
    score:
      expect_answer: '(?:q3\s*[:=]\s*)?\$?48[,\s]?117(?:\.0+)?'
      answer_shape: '(?:q3\s*[:=]\s*)?\$?\d+(?:[,\s]\d{3})*(?:\.\d+)?'
    reference:
      answer: "The exact row is `Lowmarsh,44380,46215,48117,49302`, and q3 is its fourth column.\n\nANSWER: 48117"
      tools: [read_file]
      wrong_answers:
        - "ANSWER: 40117"  # Lowmarsh East
        - "Lowmarsh's q3 is 48117; Lowmarsh East, the first substring match, has 40117.\n\nANSWER: 40117"  # right value in prose, the look-alike row committed
        - "ANSWER: 38904"  # Lowmarsh West
        - "ANSWER: 49302"  # the q4 column
        - "ANSWER: 46215"  # the q2 column
        - "40117"  # bare, no answer line: Lowmarsh East
      right_answers:
        - "ANSWER: 48117"
        - "Three rows start with Lowmarsh: Lowmarsh East (q3 40117), Lowmarsh (q3 48117) and Lowmarsh West (q3 38904). Only the middle one is named exactly \"Lowmarsh\"; its q1-q4 are 44380, 46215, 48117, 49302.\n\nANSWER: 48117"  # rules out the look-alike rows and walks the columns
        - "**ANSWER:** $48,117.00"
        - "Final answer: 48117.0"  # computed as a float
        - "ANSWER: 48 117"  # space thousands separator
        - "Hence 48,117."  # bare value behind a lead-in, no answer line: credited
        - "ANSWER: q3 = 48117"  # labelled with the column name
        - "Final Answer: $\\boxed{48{,}117}$"  # LaTeX \boxed{} with a thousands separator
        - "Lowmarsh had q3 revenue of 48117."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "The row named exactly Lowmarsh sits between Lowmarsh East and Lowmarsh West in revenue.csv."  # prose with no clear answer, no answer line
    notes: "Row and column intersection. Lowmarsh East and Lowmarsh West are look-alike rows that a substring match also returns."

