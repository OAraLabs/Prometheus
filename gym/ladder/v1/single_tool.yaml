  - id: st-glob-list-v2-migrations
    difficulty: hard
    prompt: "List every file directly inside migrations/ (not in its subfolders) whose name starts with V2_ and ends with .sql. End your reply with a final line `ANSWER: <the matching file names, separated by commas>`."
    setup_files:
      migrations/V1_001_init.sql: |
        CREATE TABLE ledger (id INTEGER PRIMARY KEY);
      migrations/V1_002_users.sql: |
        CREATE TABLE users (id INTEGER PRIMARY KEY);
      migrations/V2_003_add_index.sql: |
        CREATE INDEX ledger_ts ON ledger (ts);
      migrations/V2_004_notes.md: |
        Split ledger before dropping legacy columns.
      migrations/V2_005_split_ledger.sql: |
        CREATE TABLE ledger_archive AS SELECT * FROM ledger;
      migrations/V2_006_seed.sql.bak: |
        INSERT INTO users VALUES (1);
      migrations/V2_008_drop_legacy.sql: |
        ALTER TABLE ledger DROP COLUMN legacy_ref;
      migrations/V3_009_partition.sql: |
        -- partition ledger by month
      migrations/archive/V2_002_old.sql: |
        -- superseded
    score:
      expect_answer: '(?!.*(V2_\d+_).*\1)(?:(?:[\s,`]|\band\b)*(?:(?:\./|/[^\s,`]*/)?migrations/)?V2_(?:003_add_index|005_split_ledger|008_drop_legacy)\.sql`?){3}'
      answer_shape: '[\w./-]+\.\w+(?:(?:\s*,\s*|\s+)(?:and\s+)?[\w./-]+\.\w+)+'
    reference:
      answer: "Globbing migrations/V2_*.sql (non-recursive) matches three files.\n\nANSWER: V2_003_add_index.sql, V2_005_split_ledger.sql, V2_008_drop_legacy.sql"
      tools: [glob]
      wrong_answers:
        - "ANSWER: V2_003_add_index.sql, V2_005_split_ledger.sql, V2_006_seed.sql.bak, V2_008_drop_legacy.sql"  # included the .bak
        - "The matching files are V2_003_add_index.sql, V2_005_split_ledger.sql and V2_008_drop_legacy.sql.\n\nANSWER: archive/V2_002_old.sql, V2_003_add_index.sql, V2_005_split_ledger.sql, V2_008_drop_legacy.sql"  # right list in prose, a recursive glob committed
        - "ANSWER: V2_003_add_index.sql, V2_005_split_ledger.sql"  # missed one
        - "ANSWER: V2_003_add_index.sql, V2_004_notes.md, V2_005_split_ledger.sql, V2_008_drop_legacy.sql"  # globbed V2_* without the .sql filter
        - "ANSWER: V2_003_add_index.sql, V2_005_split_ledger.sql, V2_005_split_ledger.sql"  # one name twice, one missing
        - "V2_003_add_index.sql, V2_005_split_ledger.sql"  # bare, no answer line: missed one
        - "ANSWER: V2_003_add_index.sql, V2_005_split_ledger.sql, archive/V2_008_drop_legacy.sql"  # one name placed under archive/, the excluded subfolder
        - "ANSWER: migrations/archive/V2_003_add_index.sql, migrations/archive/V2_005_split_ledger.sql, migrations/archive/V2_008_drop_legacy.sql"  # all three under archive/, where no such files exist
      right_answers:
        - "ANSWER: V2_003_add_index.sql, V2_005_split_ledger.sql, V2_008_drop_legacy.sql"
        - "migrations/ holds V1_001_init.sql, V1_002_users.sql, V2_003_add_index.sql, V2_004_notes.md, V2_005_split_ledger.sql, V2_006_seed.sql.bak, V2_008_drop_legacy.sql and V3_009_partition.sql, plus archive/V2_002_old.sql in a subfolder. V2_004_notes.md and V2_006_seed.sql.bak do not end in .sql, and archive/ is a subfolder.\n\nANSWER: V2_003_add_index.sql, V2_005_split_ledger.sql, V2_008_drop_legacy.sql"  # walks the directory, naming every distractor
        - "**ANSWER:** `V2_003_add_index.sql`, `V2_005_split_ledger.sql`, `V2_008_drop_legacy.sql`"
        - "Final answer: migrations/V2_008_drop_legacy.sql, migrations/V2_005_split_ledger.sql and migrations/V2_003_add_index.sql"  # another order, with the directory prefix
        - "The non-recursive glob matches three files:\n\nV2_003_add_index.sql, V2_005_split_ledger.sql and V2_008_drop_legacy.sql"  # bare list on the last line, no answer line: credited
        - "ANSWER:\nV2_003_add_index.sql, V2_005_split_ledger.sql, V2_008_drop_legacy.sql"  # the value on the line below the label
        - "ANSWER: /tmp/prometheus-ladder/ws/migrations/V2_003_add_index.sql, /tmp/prometheus-ladder/ws/migrations/V2_005_split_ledger.sql, /tmp/prometheus-ladder/ws/migrations/V2_008_drop_legacy.sql"  # absolute paths into migrations/
      format_misses:
        - "V2_003_add_index.sql\nV2_005_split_ledger.sql\nV2_008_drop_legacy.sql"  # one name per line, no answer line: the last line is one name, so the answer cannot be isolated
        - "- V2_003_add_index.sql\n- V2_005_split_ledger.sql\n- V2_008_drop_legacy.sql"  # a bulleted list, no answer line
        - "Three files directly inside migrations/ start with V2_ and end with .sql; archive/ is a subfolder."  # prose with no clear answer, no answer line
    notes: "A non-recursive glob with two filters; V2_004_notes.md, V2_006_seed.sql.bak and archive/V2_002_old.sql are the distractors. The ANSWER line may list the three names in any order, with or without a directory prefix."

