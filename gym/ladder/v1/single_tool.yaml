  - id: st-run-fee-script-arg
    difficulty: medium
    prompt: "Run `python3 calc_fee.py 1840` and report the fee it prints. End your reply with a final line `ANSWER: <the fee>`."
    setup_files:
      calc_fee.py: |
        import sys

        if len(sys.argv) != 2:
            print("usage: calc_fee.py AMOUNT")
            sys.exit(2)

        amount = int(sys.argv[1])
        tier = 0.0375 if amount >= 1000 else 0.05
        fee = round(amount * tier + 1.29 + (amount % 7) * 0.11, 2)
        print(f"fee: {fee:.2f}")
    score:
      expect_answer: '(?:fee\s*[:=]\s*)?\$?70\.95'
      answer_shape: '(?:fee\s*[:=]\s*)?\$?\d+(?:[,\s]\d{3})*\.\d{2}'
    reference:
      answer: "The script prints `fee: 70.95`.\n\nANSWER: 70.95"
      tools: [bash]
      wrong_answers:
        - "ANSWER: 70.29"  # the modulo term left out
        - "The script printed fee: 70.95; the base fee at 3.75% is 69.00.\n\nANSWER: 69.00"  # right value in prose, the base fee committed
        - "ANSWER: 93.95"  # the other tier
        - "ANSWER: 69.66"  # the 1.29 left out
        - "ANSWER: 1840"  # echoed the argument
        - "70.29"  # bare, no answer line: the modulo term left out
      right_answers:
        - "ANSWER: 70.95"
        - "1840 >= 1000, so the 3.75% tier applies, not 5% (which would give 93.95): 1840 * 0.0375 = 69.00, plus 1.29, plus (1840 % 7) * 0.11 = 0.66, is 70.95. The script prints fee: 70.95.\n\nANSWER: 70.95"  # shows the derivation, naming the other tier
        - "**ANSWER:** $70.95"
        - "Final answer: fee: 70.95"
        - "The script printed its fee line:\n\n70.95"  # bare value on the last line, no answer line: credited
        - "ANSWER: fee = 70.95"  # labelled with =
        - "Final Answer: $\\boxed{\\$70.95}$"  # LaTeX \boxed{} with an escaped dollar
        - "The script prints fee: 70.95"  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "calc_fee.py applies the 3.75% tier to 1840 and adds a fixed charge plus a modulo term."  # prose with no clear answer, no answer line
    notes: "The fee can only be had by running the script. The wrong fees are hand-computation slips (the other tier, or a term left out)."

