  - id: st-read-csv-sku-price
    difficulty: medium
    prompt: "In inventory.csv, what is the unit_price of the SKU QX-4471 (exactly that SKU)? End your reply with a final line `ANSWER: <the price>`."
    setup_files:
      inventory.csv: |
        sku,name,unit_price,stock
        QX-4417,Brass hinge large,81.53,40
        QX-4471-B,Brass hinge small boxed,19.99,31
        QX-4714,Steel latch,7.80,500
        QX-4471,Brass hinge small,18.35,212
        QZ-4471,Zinc hinge,18.53,90
    score:
      expect_answer: '(?:unit_price\s*[:=]\s*)?\$?18\.35'
      answer_shape: '(?:unit_price\s*[:=]\s*)?\$?\d+(?:[,\s]\d{3})*\.\d{2}'
    reference:
      answer: "The exact row is `QX-4471,Brass hinge small,18.35,212`.\n\nANSWER: 18.35"
      tools: [read_file]
      wrong_answers:
        - "ANSWER: 19.99"  # QX-4471-B, the prefix match
        - "QX-4471 lists 18.35 and QX-4471-B lists 19.99; a grep for QX-4471 returns the -B row first.\n\nANSWER: 19.99"  # right value in prose, the prefix match committed
        - "ANSWER: 18.53"  # QZ-4471, digits swapped
        - "ANSWER: 81.53"  # QX-4417
        - "ANSWER: 212"  # the stock column
        - "19.99"  # bare, no answer line: QX-4471-B, the prefix match
      right_answers:
        - "ANSWER: 18.35"
        - "Several SKUs look alike: QX-4417 is 81.53, QX-4471-B (boxed) is 19.99, QX-4714 is 7.80 and QZ-4471 is 18.53. The exact SKU QX-4471 is the row `QX-4471,Brass hinge small,18.35,212`.\n\nANSWER: 18.35"  # rules out every look-alike first
        - "**ANSWER:** $18.35"
        - "Final answer: unit_price = 18.35"
        - "The exact row is QX-4471,Brass hinge small,18.35,212.\n\n18.35"  # bare value on the last line, no answer line: credited
        - "Final Answer: $\\boxed{\\$18.35}$"  # LaTeX \boxed{} with an escaped dollar
        - "ANSWER: \\$18.35"  # a markdown-escaped dollar
        - "QX-4471 has a unit_price of 18.35."  # the right value in prose, no answer line: its one value of the answer's kind is read, and credited
      format_misses:
        - "QX-4471 is the Brass hinge small row; QX-4471-B is a different SKU with its own price."  # prose with no clear answer, no answer line
    notes: "Exact-match lookup of one CSV row. QX-4471-B (a prefix match), QX-4417, QX-4714 and QZ-4471 are look-alikes."

  - id: st-grep-defines-function
    difficulty: medium
    smoke: true
    prompt: "Which file in this project DEFINES the function reconcile_ledger_v3 (not one that only imports or calls it)? End your reply with a final line `ANSWER: <the file path>`."
    setup_files:
      src/billing/__init__.py: ""
      src/billing/settle.py: |
        from decimal import Decimal


        def reconcile_ledger_v3(entries, cutoff):
            """Sum settled entries up to the cutoff."""
            return sum((Decimal(e["amount"]) for e in entries if e["ts"] <= cutoff),
                       Decimal(0))
      src/billing/legacy.py: |
        def reconcile_ledger_v2(entries):
            return sum(e["amount"] for e in entries)
      src/jobs/nightly.py: |
        from billing.settle import reconcile_ledger_v3


        def run(batch, cutoff):
            return reconcile_ledger_v3(batch, cutoff)
      src/api/routes.py: |
        from billing import settle


        def ledger_total(req):
            return settle.reconcile_ledger_v3(req.entries, req.cutoff)
    score:
      expect_answer: '(?:(?:\./|/\S*/)?src/)?billing/settle\.py(?::\d+)?'
      answer_shape: '[\w./-]+\.py(?::\d+)?'
    reference:
      answer: "`def reconcile_ledger_v3(entries, cutoff):` is on line 4 of src/billing/settle.py.\n\nANSWER: src/billing/settle.py"
      tools: [grep]
      wrong_answers:
