[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI: `prometheus` is taken by prometheus-client; we publish as
# `oara-prometheus` but the import path / console scripts stay as `prometheus`.
name = "oara-prometheus"
version = "0.9.3"
description = "An AI agent daemon that runs on hardware you own."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: an SPDX expression, emitted as License-Expression. It deprecates
# the "License ::" classifiers, so none is listed below.
license = "MIT"
authors = [{ name = "OAra Labs" }]
# The Python versions are exactly the ci.yml test matrix — a version that
# is admitted by requires-python but not tested is not claimed here. Linux
# is what CI runs on; macOS is the Homebrew install, verified on Apple
# Silicon.
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    # >=4.14.2: CVE-2026-63374 and CVE-2026-64847 both land in 4.14.2. The floor is the
    # DURABLE half of this fix — the lock is what pip-audit reads, but a floor left at 4.0
    # lets any future re-resolve walk straight back onto a vulnerable release.
    "anyio>=4.14.2",
    "python-telegram-bot>=21.0",
    "croniter>=2.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    "openpyxl>=3.1.0",
    # piper-tts, sounddevice and scipy are NOT here — see the `voice` extra.
    "watchdog>=4.0",
    # FOUNDATION Part 3.2: node identity is Ed25519, and identity must not
    # inherit the optional-extra fragility the push stack has (enabled-but-
    # missing-deps as a boot failure). Already in the lock via authlib; this
    # makes it a declared base need. The push extra keeps its own pin.
    "cryptography>=42",
    # The web API — the REST server Beacon pairs with and the WebSocket
    # bridge it streams from. Base since 0.9.2: until then it was the `web`
    # extra, so `pip install oara-prometheus` (and the Homebrew formula,
    # built from this list) could not start `oara daemon` at all, not even
    # into setup mode. Plain uvicorn, not uvicorn[standard]: the daemon runs
    # its WebSocket bridge on `websockets` directly and needs none of the
    # standard extras' native speedups. tests/test_web_is_base.py pins this.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    # The live recorder's multipart trace upload (POST
    # /api/learning/live-upload — Record a Skill) parses with it; without it
    # that endpoint answers 400. Beacon uses it, so a plain install carries it.
    # >=0.0.31: every advisory published against it is fixed by 0.0.31, the
    # last being CVE-2026-53540 (0.0.30 still carries it — pip-audit). The
    # floor matters as much as the lock: the lock pinned 0.0.29 through four
    # of those advisories while this package was extra-only, where CI's audit
    # of the base closure never looked.
    "python-multipart>=0.0.31",
    # >=1.3.1: CVE-2026-54282, CVE-2026-54283, CVE-2026-48817 and
    # CVE-2026-48818 are all fixed by 1.3.1 (the last, CVE-2026-54283, in
    # 1.3.1 itself). starlette is fastapi's dependency, not a direct one of
    # ours — but the floor is the DURABLE half of this fix: pip will not
    # upgrade an already-installed starlette that still satisfies fastapi's
    # range, so without it an upgraded install keeps the vulnerable version,
    # and a future re-resolve can walk straight back onto one.
    "starlette>=1.3.1",
]

[project.urls]
Homepage = "https://oara.ai/prometheus"
Source = "https://github.com/OAraLabs/Prometheus"
Issues = "https://github.com/OAraLabs/Prometheus/issues"
Documentation = "https://github.com/OAraLabs/Prometheus/tree/main/docs/guide"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# GRAFT-MOBILE-BRIDGE 2: APNs push. ES256 JWT is hand-rolled on cryptography
# (no APNs library, per the spec); h2 gives httpx its HTTP/2. push.enabled
# with these missing fails the boot loudly.
push = ["cryptography>=42", "h2>=4"]
browser = ["playwright>=1.40"]
# MILESTONE 2: the real desktop driver. MIT, ZERO runtime dependencies, a
# platform wheel bundling generated UniFFI bindings and a Rust library — so
# this extra adds exactly one lock entry and no transitive tail.
#
# ⚠ DELIBERATELY NOT IN CI's extras and not in `full`. The driver leg cannot
# be exercised without a display, so installing it in CI would buy nothing
# and would imply coverage that does not exist. See
# computer/cua.py's module docstring.
computer = ["cua-driver>=0.28,<1"]
# Onboarding Phase 0 papercut: whisper STT was used for voice input but
# never declared anywhere. The faster-whisper python API is the pip-
# installable engine; the whisper/faster-whisper-xxl CLIs also work.
#
# piper-tts, sounddevice and scipy were BASE dependencies from #22 until
# 0.9.1, which made every install carry voice's native stack whether or not
# it ever spoke. piper-tts drags in onnxruntime, which ships no sdist and no
# macOS x86_64 wheel after 1.23.2, and 1.23.2 stops at cp313. On an Intel
# Mac the base install therefore did not resolve at all under Python 3.14,
# resolved under <=3.13 only by backtracking onto that abandoned line, and
# uv.lock's onnxruntime (1.26.0) has no Intel-mac wheel whatever the Python.
# Nothing imports any of them at module level: piper is run as a CLI
# subprocess, sounddevice/scipy are imported inside the mic and playback
# functions. tests/test_voice_is_an_extra.py pins both halves — the
# declaration here, and that the package imports and the daemon boots
# with all of it absent.
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.4.2",
    "sounddevice>=0.5.5",
    "scipy>=1.17.1",
]
# UPPER BOUND IS LOAD-BEARING — see tests/test_mcp_dependency_pin.py.
# mcp 2.x moved ClientSession.list_tools to a keyword-only `params=`;
# mcp/runtime.py calls it with `cursor=`, so 2.x is a TypeError on the
# FIRST discovery call and every server connection dies there.
# >=1.28.1: CVE-2026-52870 and CVE-2026-52869 are fixed in 1.27.2 and
# CVE-2026-59950 in 1.28.1. The floor is the DURABLE half of the fix — pip
# keeps an installed mcp that still satisfies the requirement, so an upgraded
# install would otherwise keep a vulnerable SDK. pydantic-settings is mcp's
# dependency, not ours, but gets a floor for the same reason: >=2.14.2
# (CVE-2026-58203).
mcp = ["mcp>=1.28.1,<2", "pydantic-settings>=2.14.2"]
slack = ["slack-bolt>=1.18.0", "slack-sdk>=3.27.0"]
# SPRINT G2: Discord gateway adapter. Optional so base installs stay slim
# (discord.py pulls aiohttp); import-guarded exactly like the slack extra.
# >=3.14.3: aiohttp is discord.py's HTTP and gateway client, and 3.14.3 is the
# first release with every advisory against 3.13.x fixed (the last,
# CVE-2026-69244). discord.py's own range admits older ones, and pip keeps an
# installed version that satisfies it — so the floor has to be ours.
discord = ["discord.py>=2.3.0", "aiohttp>=3.14.3"]
# Polish sprint WS2: Beacon dashboard backend + WS bridge. Everything here is
# a BASE dependency since 0.9.2, so the extra adds nothing; it stays defined,
# with the same packages, so every existing `pip install
# 'oara-prometheus[web]'` still works.
web = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12", "python-multipart>=0.0.31"]
evals = [
    "deepeval>=2.0",
    # >=16.4.0: arize-phoenix pins strawberry-graphql EXACTLY, and every
    # release before 16.4.0 pins 0.314.3 (three advisories, fixed by 0.315.7);
    # 16.4.0 pins 0.316.0. Floored here because no strawberry requirement of
    # ours could move it past phoenix's pin.
    "arize-phoenix>=16.4.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
# Polish sprint WS4: meta-extra so `pip install oara-prometheus[full]`
# pulls in every optional surface. The README docs install
#     `pip install oara-prometheus` for the daemon, its web API and Beacon
#       pairing, the CLI and Telegram
#     `pip install oara-prometheus[full]` to add Slack, Discord, MCP, the
#       browser tool, the Anthropic provider and voice output in one step.
# fastapi/uvicorn/websockets stay listed here although the base now carries
# them, so `full` never depends on where the base list happens to stand.
full = [
    "anthropic>=0.40",
    "playwright>=1.40",
    "mcp>=1.28.1,<2",  # floor and upper bound both load-bearing — see the `mcp` extra above
    "pydantic-settings>=2.14.2",  # mcp's; security floor — see the `mcp` extra
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "discord.py>=2.3.0",
    "aiohttp>=3.14.3",  # discord.py's; security floor — see the `discord` extra
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    # Voice OUTPUT — base dependencies until 0.9.1, so `full` keeps them and
    # an existing `[full]` install loses nothing. faster-whisper (voice
    # INPUT) was never in `full` and still is not: that is the `voice` extra.
    "piper-tts>=1.4.2",
    "sounddevice>=0.5.5",
    "scipy>=1.17.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
# The command is `oara` (2026-09-01, item C of the roadmap): `pip install oara`
# and `brew install oaralabs/tap/oara` both put an `oara` on PATH, and a package
# named oara that installs a `prometheus` binary collides with the CNCF project
# in every shell. The import path and the package stay `prometheus`.
oara = "prometheus.__main__:main"
# The daemon is `oara daemon` — a subcommand, not a second binary.
# Aliases for the deprecation window: every documented `prometheus …` command
# keeps working. The chat surfaces print a one-line note when invoked this way.
prometheus = "prometheus.__main__:main"
prometheus-init = "prometheus.cli.init:main"
prometheus-daemon = "prometheus.daemon:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus"]
# Polish sprint WS2: ship the Beacon frontend (static index.html) inside
# the wheel so `prometheus daemon` can serve the dashboard without an
# extra checkout step.
include = ["src/prometheus/web/static/*"]

# The config template, mapped INTO the package. It is by a wide margin the
# best documentation of what Prometheus can be configured to do, and it did
# not ship: `packages = ["src/prometheus"]` covers the package tree and the
# template lives at the repo root, so `pip install oara-prometheus` had no
# copy of it — verified by rglob against a real installed wheel, not inferred
# from this file.
#
# force-include rather than a move: the repo keeps ONE source file at its
# documented path, every existing reference (tests, docs, PROMETHEUS.md) stays
# valid, and there is no second copy in the tree to drift. The wheel gets it
# at prometheus/config/prometheus.yaml.default, which is where
# `config.template.get_template_path()` looks first.
[tool.hatch.build.targets.wheel.force-include]
"config/prometheus.yaml.default" = "prometheus/config/prometheus.yaml.default"
# Same defect, same fix: templates/ sat at the repo root, outside
# `packages = ["src/prometheus"]`, so `oara setup` died at the identity step
# on every pip install while every checkout worked. Resolved by
# `cli.generate_identity.identity_template_path()`, which looks here first.
"templates/SOUL.md.template" = "prometheus/templates/SOUL.md.template"
"templates/AGENTS.md.template" = "prometheus/templates/AGENTS.md.template"
# And again: the model registry decides the adapter tier for local models
# (listed with native tool calling -> "light", otherwise "full"). It sat at
# the repo root, so every pip and Homebrew install ran every local model at
# "full". Resolved by `config.model_registry.get_model_registry_path()`,
# which looks here first. The sdist already carries it under /config, and a
# wheel built FROM the sdist (Homebrew's path) picks it up through this line.
"config/model_registry.yaml" = "prometheus/config/model_registry.yaml"

# ---------------------------------------------------------------------------
# SDIST — an explicit ALLOWLIST, because the default is not a decision.
#
# Hatchling's default sdist is "everything the VCS does not ignore". On this
# repo that produced a 9,790-file tarball, of which 8,872 were `.claude/
# worktrees/` — eleven full copies of the repo, three of them sitting on
# commits from BEFORE the 2026-08-01 tailnet-IP purge (9a25a50, #130) and so
# carrying the pre-scrub blobs of the exact three files that purge cleaned.
# Another 54 were untracked working-tree files that had never passed
# .githooks/pre-commit.
#
# The reason the default behaved that way is the finding worth keeping:
# `.claude/worktrees/` was excluded via `.git/info/exclude`, which is
# PER-CLONE and untracked. Git honoured it, the build backend did not, and no
# other clone had it — so local, invisible, unversioned state decided what a
# release artifact contained. `.gitignore` now carries the rule instead.
#
# This is an allowlist rather than a denylist deliberately (CROSS-CUTTING §5 —
# a property that cannot be violated beats a check that must remember to run).
# A denylist needs a new entry every time someone creates a new scratch
# directory, and the failure mode is silent shipping. An allowlist's failure
# mode is a missing file, which is loud.
#
# Scope: what is needed to BUILD, INSTALL and VERIFY the package. Not docs/,
# audits/, gym/, skills/ or root scratch files — those are repository
# artifacts, not distribution content.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/config",
    "/packaging",
    "/templates",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "no_manager_drain: do not auto-shutdown BackgroundTaskManagers (leak-detector self-test only)",
    "integration: integration wiring tests (verify components are connected at runtime)",
    "network: tests that require live network access (skip with -m 'not network')",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pip-audit>=2.7",
]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
# SCOPED TO src/ ON PURPOSE. `src/` is clean under this rule set as of
# 2026-09-09 and CI gates it, so it stays clean. tests/ and scripts/ carry 385
# violations of the same rules and are the intended next widening — gating them
# today would mean either a 385-fix PR bolted onto this one, or an ignore list
# large enough to be the hiding place the gate exists to remove.
[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# ruff's own default (pycodestyle errors + pyflakes), stated explicitly so a
# future ruff release cannot widen or narrow the gate without a visible diff.
#
# This is the high-signal core, not a style opinion: it found a live
# `NameError` (F821 in memory/lcm_fts5.py — see tests/test_lcm_fts5_helpers.py),
# a long-running task that was never registered for shutdown cancellation
# (F841 in daemon.py), and two route handlers sharing a name 3000 lines apart
# (F811 in web/server.py).
#
# NEXT WIDENING, in the order they are worth doing:
#   * the ASYNC rules — 4 violations today, and they name exactly the
#     "blocking work on the event loop" class the 2026-09 audit ranked
#     seventh. Each fix is a behaviour change, so they belong in their own PR.
#   * tests/ and scripts/ (385 violations, mostly E741/E402/F541).
select = ["E4", "E7", "E9", "F"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/prometheus"]
branch = false

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
