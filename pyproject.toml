[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI: `prometheus` is taken by prometheus-client; we publish as
# `oara-prometheus` but the import path / console scripts stay as `prometheus`.
name = "oara-prometheus"
version = "0.1.0"
description = "Sovereign AI agent harness — extract, adapt, integrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "anyio>=4.0",
    "python-telegram-bot>=21.0",
    "croniter>=2.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    "openpyxl>=3.1.0",
    "piper-tts>=1.4.2",
    "sounddevice>=0.5.5",
    "scipy>=1.17.1",
    "watchdog>=4.0",
    # FOUNDATION Part 3.2: node identity is Ed25519, and identity must not
    # inherit the optional-extra fragility the push stack has (enabled-but-
    # missing-deps as a boot failure). Already in the lock via authlib; this
    # makes it a declared base need. The push extra keeps its own pin.
    "cryptography>=42",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# GRAFT-MOBILE-BRIDGE 2: APNs push. ES256 JWT is hand-rolled on cryptography
# (no APNs library, per the spec); h2 gives httpx its HTTP/2. push.enabled
# with these missing fails the boot loudly.
push = ["cryptography>=42", "h2>=4"]
browser = ["playwright>=1.40"]
# Onboarding Phase 0 papercut: whisper STT was used for voice input but
# never declared anywhere. The faster-whisper python API is the pip-
# installable engine; the whisper/faster-whisper-xxl CLIs also work.
voice = ["faster-whisper>=1.0"]
mcp = ["mcp>=1.0"]
slack = ["slack-bolt>=1.18.0", "slack-sdk>=3.27.0"]
# SPRINT G2: Discord gateway adapter. Optional so base installs stay slim
# (discord.py pulls aiohttp); import-guarded exactly like the slack extra.
discord = ["discord.py>=2.3.0"]
# Polish sprint WS2: Beacon dashboard backend + WS bridge. Optional so the
# CLI/Telegram-only path stays slim. python-multipart backs the live
# recorder's multipart trace upload (POST /api/learning/live-upload).
web = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12", "python-multipart>=0.0.9"]
evals = [
    "deepeval>=2.0",
    "arize-phoenix>=5.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
# Polish sprint WS4: meta-extra so `pip install oara-prometheus[full]`
# pulls in every optional surface. The README docs install
#     `pip install oara-prometheus` for the minimal CLI/Telegram path
#     `pip install oara-prometheus[full]` to get the dashboard, Slack,
#       browser tools, MCP, and the Anthropic provider in one step.
full = [
    "anthropic>=0.40",
    "playwright>=1.40",
    "mcp>=1.0",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "discord.py>=2.3.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
# The command is `oara` (2026-09-01, item C of the roadmap): `pip install oara`
# and `brew install oaralabs/tap/oara` both put an `oara` on PATH, and a package
# named oara that installs a `prometheus` binary collides with the CNCF project
# in every shell. The import path and the package stay `prometheus`.
oara = "prometheus.__main__:main"
# The daemon is `oara daemon` — a subcommand, not a second binary.
# Aliases for the deprecation window: every documented `prometheus …` command
# keeps working. The chat surfaces print a one-line note when invoked this way.
prometheus = "prometheus.__main__:main"
prometheus-init = "prometheus.cli.init:main"
prometheus-daemon = "prometheus.daemon:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus"]
# Polish sprint WS2: ship the Beacon frontend (static index.html) inside
# the wheel so `prometheus daemon` can serve the dashboard without an
# extra checkout step.
include = ["src/prometheus/web/static/*"]

# The config template, mapped INTO the package. It is by a wide margin the
# best documentation of what Prometheus can be configured to do, and it did
# not ship: `packages = ["src/prometheus"]` covers the package tree and the
# template lives at the repo root, so `pip install oara-prometheus` had no
# copy of it — verified by rglob against a real installed wheel, not inferred
# from this file.
#
# force-include rather than a move: the repo keeps ONE source file at its
# documented path, every existing reference (tests, docs, PROMETHEUS.md) stays
# valid, and there is no second copy in the tree to drift. The wheel gets it
# at prometheus/config/prometheus.yaml.default, which is where
# `config.template.get_template_path()` looks first.
[tool.hatch.build.targets.wheel.force-include]
"config/prometheus.yaml.default" = "prometheus/config/prometheus.yaml.default"

# ---------------------------------------------------------------------------
# SDIST — an explicit ALLOWLIST, because the default is not a decision.
#
# Hatchling's default sdist is "everything the VCS does not ignore". On this
# repo that produced a 9,790-file tarball, of which 8,872 were `.claude/
# worktrees/` — eleven full copies of the repo, three of them sitting on
# commits from BEFORE the 2026-08-01 tailnet-IP purge (9a25a50, #130) and so
# carrying the pre-scrub blobs of the exact three files that purge cleaned.
# Another 54 were untracked working-tree files that had never passed
# .githooks/pre-commit.
#
# The reason the default behaved that way is the finding worth keeping:
# `.claude/worktrees/` was excluded via `.git/info/exclude`, which is
# PER-CLONE and untracked. Git honoured it, the build backend did not, and no
# other clone had it — so local, invisible, unversioned state decided what a
# release artifact contained. `.gitignore` now carries the rule instead.
#
# This is an allowlist rather than a denylist deliberately (CROSS-CUTTING §5 —
# a property that cannot be violated beats a check that must remember to run).
# A denylist needs a new entry every time someone creates a new scratch
# directory, and the failure mode is silent shipping. An allowlist's failure
# mode is a missing file, which is loud.
#
# Scope: what is needed to BUILD, INSTALL and VERIFY the package. Not docs/,
# audits/, gym/, skills/ or root scratch files — those are repository
# artifacts, not distribution content.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/config",
    "/packaging",
    "/templates",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration wiring tests (verify components are connected at runtime)",
    "network: tests that require live network access (skip with -m 'not network')",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
