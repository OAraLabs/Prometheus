<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prometheus Beacon</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header>
  <h1>Prometheus Beacon</h1>
  <div class="status">
    <span class="pill" id="model-pill">Model: …</span>
    <span class="pill" id="uptime-pill">Uptime: …</span>
    <span class="pill ws-state" id="ws-pill">WS: connecting</span>
  </div>
</header>

<main>
  <div class="col">
    <div class="panel panel-fill">
      <h2>Activity Feed <span class="badge" id="feed-count">0</span></h2>
      <div class="panel-body" id="feed">
        <div class="feed-empty">Connecting…</div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="panel panel-half">
      <h2>Memory</h2>
      <div class="panel-body" id="memory">
        <div class="feed-empty">Loading…</div>
      </div>
    </div>

    <div class="panel panel-grow">
      <h2>Skills <span class="badge" id="skills-count">0</span></h2>
      <div class="panel-body" id="skills">
        <div class="feed-empty">Loading…</div>
      </div>
    </div>

    <div class="panel panel-fixed">
      <h2>Tools <span class="badge" id="deferred-badge">…</span></h2>
      <div class="panel-body" id="tools-panel">
        <div class="tools-row">
          <span class="tools-label">Deferred tool loading</span>
          <span class="tools-modes" id="deferred-modes">
            <button data-mode="auto" data-deferred="auto">Auto</button>
            <button data-mode="on" data-deferred="on">On</button>
            <button data-mode="off" data-deferred="off">Off</button>
          </span>
        </div>
        <div class="tools-status" id="deferred-status">Loading…</div>
        <!-- Spec: never imply live effect — this is repeated from the API's
             `applies` field and must stay visible at all times. -->
        <div class="tools-note" id="deferred-note">Changes apply at the next run start — not to a session already running.</div>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-panel">
    <h3>
      <span id="modal-title">Skill</span>
      <button id="modal-close" type="button">×</button>
    </h3>
    <pre id="modal-body">Loading…</pre>
  </div>
</div>

<script src="/app.js" defer></script>

</body>
</html>
